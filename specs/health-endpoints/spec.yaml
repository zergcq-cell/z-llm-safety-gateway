# spec.yaml - 行为规格（Canonical YAML，AI 主读文档）
# Capability: health-endpoints
# Change: 2026-08-11-v0.0.1-framework-skeleton

meta:
  capability: "health-endpoints"
  change_id: "2026-08-11-v0.0.1-framework-skeleton"
  created: "2026-08-11T00:00:00+08:00"
  confidence: high

requirements:
  - id: REQ-001
    description: "GET /health 是 liveness 探针，返回 HTTP 200 和 JSON body {\"status\": \"healthy\"}，不检查任何依赖"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "proposal.yaml -> capabilities.new[4]; DESIGN.md Section 4.1"
        given: "FastAPI 服务器已启动并监听"
        when: "客户端发送 GET /health 请求"
        then: "服务器 SHALL 返回 HTTP 200"
        and:
          - "响应 body SHALL 为 JSON {\"status\": \"healthy\"}"
          - "响应 Content-Type SHALL 为 application/json"
          - "liveness 探针 SHALL NOT 检查任何外部依赖（provider、数据库等）"

  - id: REQ-002
    description: "GET /ready 是 readiness 探针，当服务器就绪（配置已加载、provider 客户端已初始化）时返回 HTTP 200 和 JSON body {\"status\": \"ready\"}"
    scenarios:
      - id: SC-002
        confidence: high
        evidence: "proposal.yaml -> capabilities.new[4]; DESIGN.md Section 4.1; design.md Decision 7"
        given: "服务器配置已加载完成"
        and: "provider 客户端已初始化"
        when: "客户端发送 GET /ready 请求"
        then: "服务器 SHALL 返回 HTTP 200"
        and:
          - "响应 body SHALL 为 JSON {\"status\": \"ready\"}"
          - "响应 Content-Type SHALL 为 application/json"

  - id: REQ-003
    description: "GET /ready 在服务器未就绪时返回 HTTP 503 和 JSON body {\"status\": \"not_ready\"}"
    scenarios:
      - id: SC-003
        confidence: high
        evidence: "design.md Decision 7; proposal.yaml -> capabilities.new[4]"
        given: "服务器配置尚未加载完成或 provider 客户端尚未初始化"
        when: "客户端发送 GET /ready 请求"
        then: "服务器 SHALL 返回 HTTP 503"
        and:
          - "响应 body SHALL 为 JSON {\"status\": \"not_ready\"}"
          - "响应 Content-Type SHALL 为 application/json"

  - id: REQ-004
    description: "GET /metrics 返回 HTTP 200 和 text/plain 内容类型（Prometheus 格式占位）"
    scenarios:
      - id: SC-004
        confidence: high
        evidence: "proposal.yaml -> capabilities.new[4]; DESIGN.md Section 4.1; design.md Decision 7"
        given: "FastAPI 服务器已启动并监听"
        when: "客户端发送 GET /metrics 请求"
        then: "服务器 SHALL 返回 HTTP 200"
        and:
          - "响应 Content-Type SHALL 为 text/plain; charset=utf-8"

  - id: REQ-005
    description: "Phase 1 中 /metrics 响应 body 为 '# z LLM Safety Gateway metrics placeholder\\n'（占位文本，Phase 4 实现完整指标）"
    scenarios:
      - id: SC-005
        confidence: high
        evidence: "design.md Decision 7; proposal.yaml -> non_goals (Prometheus 指标采集实现 Phase 4)"
        given: "FastAPI 服务器已启动并监听（Phase 1）"
        when: "客户端发送 GET /metrics 请求"
        then: "响应 body SHALL 为 '# z LLM Safety Gateway metrics placeholder\\n'"
        and:
          - "Phase 1 SHALL NOT 实现实际 Prometheus 指标采集"

  - id: REQ-006
    description: "健康检查端点不需要认证（即使在 Phase 4 启用认证后仍然如此）"
    scenarios:
      - id: SC-006
        confidence: high
        evidence: "proposal.yaml -> constraints (Phase 1 不包含认证); DESIGN.md Section 4.1 (health endpoints Detection: None)"
        given: "FastAPI 服务器已启动"
        and: "请求未携带任何认证凭据（无 Authorization 头、无 API key）"
        when: "客户端分别发送 GET /health、GET /ready、GET /metrics 请求"
        then: "服务器 SHALL 返回正常响应（不返回 401 Unauthorized）"
        and:
          - "/health SHALL 返回 HTTP 200"
          - "/ready SHALL 返回 HTTP 200 或 503（取决于就绪状态）"
          - "/metrics SHALL 返回 HTTP 200"

  - id: REQ-007
    description: "所有健康检查端点响应包含 X-Request-ID 头"
    scenarios:
      - id: SC-007
        confidence: high
        evidence: "proposal.yaml -> capabilities.new[5] (request-id middleware 注入所有响应); DESIGN.md Section 4.5"
        given: "FastAPI 服务器已启动并注册了 RequestID 中间件"
        when: "客户端发送 GET /health 请求（未携带 X-Request-ID 头）"
        then: "响应 SHALL 包含 X-Request-ID 头"
        and:
          - "X-Request-ID 值 SHALL 为 UUID v4 格式"
      - id: SC-008
        confidence: high
        evidence: "proposal.yaml -> capabilities.new[5]; DESIGN.md Section 4.5"
        given: "FastAPI 服务器已启动并注册了 RequestID 中间件"
        when: "客户端发送 GET /ready 请求（未携带 X-Request-ID 头）"
        then: "响应 SHALL 包含 X-Request-ID 头"
        and:
          - "X-Request-ID 值 SHALL 为 UUID v4 格式"
      - id: SC-009
        confidence: high
        evidence: "proposal.yaml -> capabilities.new[5]; DESIGN.md Section 4.5"
        given: "FastAPI 服务器已启动并注册了 RequestID 中间件"
        when: "客户端发送 GET /metrics 请求（未携带 X-Request-ID 头）"
        then: "响应 SHALL 包含 X-Request-ID 头"
        and:
          - "X-Request-ID 值 SHALL 为 UUID v4 格式"

# Merged from 2026-08-19-detector-readiness-fail-safe on 2026-08-20.
  - id: REQ-HEALTH-601
    description: "/health 保持纯 liveness，/ready 使用 app-scoped 状态"
    scenarios:
      - id: SC-HEALTH-601
        confidence: high
        evidence: "2026-08-19-detector-readiness-fail-safe proposal C7; design sections 5/6"
        given: "无检测器或全部健康，且同进程存在多个 app 实例"
        when: "分别请求 /health 与 /ready"
        then: "/health SHALL 仅报告存活；/ready SHALL 返回 200 ready 且实例状态互不污染"
      - id: SC-HEALTH-602
        confidence: high
        evidence: "2026-08-19-detector-readiness-fail-safe proposal C4/C7; design section 6"
        given: "required 或 fail_closed 检测器 unavailable/unhealthy"
        when: "请求 /ready"
        then: "端点 SHALL 返回 503、status=not_ready 与确定的 detectors issues"
      - id: SC-HEALTH-603
        confidence: medium
        evidence: "2026-08-19-detector-readiness-fail-safe proposal C5/C7; design section 6"
        given: "仅有 fail_open 检测器 unavailable/unhealthy"
        when: "请求 /ready"
        then: "端点 SHALL 返回 200、status=ready、degraded=true 及精确摘要 schema"
  - id: REQ-HEALTH-602
    description: "readiness 健康检查并行、有界并支持恢复"
    scenarios:
      - id: SC-HEALTH-604
        confidence: medium
        evidence: "2026-08-19-detector-readiness-fail-safe design section 6"
        given: "已加载检测器健康检查抛异常或超过自身 timeout"
        when: "请求 /ready"
        then: "检查 SHALL 有界完成并映射为稳定 exception/timeout reason_code"
      - id: SC-HEALTH-605
        confidence: high
        evidence: "2026-08-19-detector-readiness-fail-safe design sections 4/6"
        given: "先 unhealthy 后恢复的已加载检测器"
        when: "后续 readiness 健康检查成功"
        then: "状态与 HTTP readiness SHALL 自动恢复且产生一次状态变化事件"
