# spec.yaml - 行为规格（Canonical YAML，AI 主读文档）
# Capability: request-id
# Change: 2026-08-11-v0.1.0-framework-skeleton

meta:
  capability: "request-id"
  change_id: "2026-08-11-v0.1.0-framework-skeleton"
  created: "2026-08-11T00:00:00+08:00"
  confidence: high

requirements:
  - id: REQ-001
    description: "如果请求中不存在 X-Request-ID 头，网关 SHALL 生成 UUID v4 作为请求 ID"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "proposal.yaml -> capabilities.new[5]; DESIGN.md Section 11.7 (Generation)"
        given: "客户端发送的请求未携带 X-Request-ID 头"
        when: "RequestID 中间件处理该请求"
        then: "网关 SHALL 生成 UUID v4 作为请求 ID"
        and:
          - "生成的 UUID v4 SHALL 符合 36 字符格式 xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"

  - id: REQ-002
    description: "如果请求中存在合法的 X-Request-ID 头，网关 SHALL 使用客户端提供的值"
    scenarios:
      - id: SC-002
        confidence: high
        evidence: "proposal.yaml -> capabilities.new[5]; DESIGN.md Section 11.7 (Client-provided)"
        given: "客户端发送的请求携带 X-Request-ID 头"
        and: "头值匹配正则 ^[a-zA-Z0-9_-]{1,128}$"
        when: "RequestID 中间件处理该请求"
        then: "网关 SHALL 使用客户端提供的 X-Request-ID 值作为请求 ID"
        and:
          - "网关 SHALL NOT 重新生成 UUID v4"

  - id: REQ-003
    description: "客户端提供的 ID 经过消毒：必须匹配 ^[a-zA-Z0-9_-]{1,128}$，不合法的 ID 被丢弃并重新生成 UUID v4"
    scenarios:
      - id: SC-003
        confidence: high
        evidence: "DESIGN.md Section 11.7 (Sanitization); design.md Decision 6"
        given: "客户端发送的请求携带 X-Request-ID 头"
        and: "头值不匹配正则 ^[a-zA-Z0-9_-]{1,128}$（如包含特殊字符、超过 128 字符）"
        when: "RequestID 中间件处理该请求"
        then: "网关 SHALL 丢弃客户端提供的无效 ID"
        and:
          - "网关 SHALL 生成新的 UUID v4 作为请求 ID"
          - "此行为 SHALL 防止 log injection（换行/控制字符破坏 JSONL）"
          - "此行为 SHALL 防止 header injection"
      - id: SC-004
        confidence: high
        evidence: "DESIGN.md Section 11.7 (Sanitization)"
        given: "客户端发送的请求携带 X-Request-ID 头"
        and: "头值为空字符串"
        when: "RequestID 中间件处理该请求"
        then: "网关 SHALL 丢弃空 ID 并生成新的 UUID v4"
        and: []

  - id: REQ-004
    description: "所有响应 SHALL 包含 X-Request-ID 头，值为该请求的请求 ID"
    scenarios:
      - id: SC-005
        confidence: high
        evidence: "proposal.yaml -> capabilities.new[5]; DESIGN.md Section 4.5 (Response Headers)"
        given: "客户端发送请求（未携带 X-Request-ID 头）"
        when: "服务器处理请求并返回响应"
        then: "响应 SHALL 包含 X-Request-ID 头"
        and:
          - "X-Request-ID 头值 SHALL 为网关生成的 UUID v4"
      - id: SC-006
        confidence: high
        evidence: "proposal.yaml -> capabilities.new[5]; DESIGN.md Section 4.5"
        given: "客户端发送请求（携带合法的 X-Request-ID: my-req-123）"
        when: "服务器处理请求并返回响应"
        then: "响应 SHALL 包含 X-Request-ID 头"
        and:
          - "X-Request-ID 头值 SHALL 为 my-req-123（客户端提供的值）"

  - id: REQ-005
    description: "所有响应 SHALL 包含 X-Safety-Action 头，值为 \"allow\"（Phase 1 无检测，始终为 allow）"
    scenarios:
      - id: SC-007
        confidence: high
        evidence: "proposal.yaml -> constraints (Phase 1 所有响应附带 X-Safety-Action: allow); DESIGN.md Section 4.5"
        given: "Phase 1 环境下服务器已启动"
        when: "客户端发送任意请求"
        then: "响应 SHALL 包含 X-Safety-Action 头"
        and:
          - "X-Safety-Action 头值 SHALL 为 \"allow\""
          - "Phase 1 中 SHALL NOT 执行任何安全检测"

  - id: REQ-006
    description: "当 action 为 \"allow\" 时，响应 SHALL NOT 包含 X-Safety-Risk-Level 头"
    scenarios:
      - id: SC-008
        confidence: high
        evidence: "DESIGN.md Section 4.5 (X-Safety-Risk-Level only when action != allow)"
        given: "Phase 1 环境下服务器已启动"
        and: "响应的 X-Safety-Action 为 \"allow\""
        when: "服务器返回响应"
        then: "响应 SHALL NOT 包含 X-Safety-Risk-Level 头"
        and: []

  - id: REQ-007
    description: "请求 ID 存储在 request.state.request_id 供下游使用"
    scenarios:
      - id: SC-009
        confidence: high
        evidence: "design.md Decision 6; DESIGN.md Section 11.7"
        given: "RequestID 中间件已处理请求并确定请求 ID"
        when: "路由处理函数或下游中间件访问 request.state"
        then: "request.state.request_id SHALL 包含该请求的请求 ID 值"
        and:
          - "request.state.request_id SHALL 为字符串类型"
          - "下游组件 SHALL 能通过 request.state.request_id 获取请求 ID 用于日志和追踪"

  - id: REQ-008
    description: "UUID v4 格式：36 字符，格式为 xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
    scenarios:
      - id: SC-010
        confidence: high
        evidence: "DESIGN.md Section 11.7 (Generation: UUID v4); design.md Decision 6"
        given: "客户端请求未携带 X-Request-ID 头"
        when: "网关生成请求 ID"
        then: "生成的 ID SHALL 为 UUID v4 格式"
        and:
          - "ID SHALL 为 36 字符长度"
          - "ID SHALL 匹配正则 ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          - "ID 第 14 位 SHALL 为 '4'（表示 UUID 版本 4）"
          - "ID 第 19 位 SHALL 为 '8'、'9'、'a' 或 'b'（RFC 4122 变体）"
