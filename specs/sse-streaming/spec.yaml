# spec.yaml — 行为规格（Canonical YAML，AI 主读文档）
# Capability: sse-streaming
# Change: 2026-08-12-v0.0.3-streaming-audit

meta:
  capability: "sse-streaming"
  change_id: "2026-08-12-v0.0.3-streaming-audit"
  created: "2026-08-12T10:00:00+08:00"
  confidence: high

requirements:
  - id: REQ-001
    description: "stream=true 请求通过 StreamingResponse 透明转发 Provider SSE chunks"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "proposal.yaml -> what_changes C1, C16; design.md -> Decision 1; DESIGN.md -> Section 8.1"
        given: "a POST request to /v1/chat/completions with stream=true and a provider that returns SSE streaming chunks"
        when: "the chat_completions handler processes the request through the stream=true branch"
        then: "the handler SHALL return a StreamingResponse that forwards provider SSE chunks to the client in order"
        and:
          - "each data: {chunk} event SHALL be forwarded transparently without modification"
          - "the stream SHALL end with data: [DONE]"
          - "the input pipeline SHALL still run before streaming starts"
          - "the handler SHALL use httpx.AsyncClient.stream() to receive provider chunks asynchronously"
      - id: SC-002
        confidence: high
        evidence: "proposal.yaml -> constraints (仅支持 SSE); design.md -> Decision 1 备选 B; DESIGN.md -> Section 8.1"
        given: "a stream=true request is being processed and the provider connection is established"
        when: "the gateway receives chunks from the provider"
        then: "the gateway SHALL preserve the order of chunks as received from the provider"
        and:
          - "the response SHALL be delivered over SSE (Server-Sent Events), not WebSocket"
          - "no content chunk SHALL be dropped or reordered during transparent forwarding"

  - id: REQ-002
    description: "滑动窗口检测——字符级累积，window_size（默认 200）满时触发窗口检测，overlap（默认 50）重叠"
    scenarios:
      - id: SC-003
        confidence: high
        evidence: "proposal.yaml -> what_changes C2; design.md -> Decision 2; DESIGN.md -> Section 8.2"
        given: "streaming.mode is sliding_window with window_size=200 and overlap=50 and an output detector is configured"
        when: "the gateway accumulates token text from provider chunks"
        then: "the gateway SHALL accumulate characters until the buffer reaches window_size (default 200 characters)"
        and:
          - "when the buffer reaches window_size, the gateway SHALL trigger one window detection run"
          - "after detection, the window SHALL slide forward by (window_size - overlap) characters, retaining the last overlap (50) characters for the next window"
          - "the window unit SHALL be character-based, not tokenizer-based"
      - id: SC-004
        confidence: high
        evidence: "proposal.yaml -> what_changes C2; design.md -> Decision 2; DESIGN.md -> Section 8.2 (overlap purpose)"
        given: "a sensitive phrase spans a window boundary (split across two consecutive windows)"
        when: "the sliding window advances with overlap=50"
        then: "the overlap SHALL retain the trailing 50 characters so that the next window includes the boundary content"
        and:
          - "the cross-boundary content SHALL therefore be present in the next window's detection"
      - id: SC-005
        confidence: medium
        evidence: "proposal.yaml -> constraints (字符级计数); design.md -> Decision 2; DESIGN.md -> Section 8.2 (v1.1+ tokenizer), 8.3 (post-audit)"
        given: "the total streamed content is less than window_size (e.g., 100 characters) and the stream completes"
        when: "the stream reaches data: [DONE]"
        then: "the final partial buffer (shorter than window_size) SHALL NOT trigger an additional synchronous window detection"
        and:
          - "if post_audit is enabled (default), the trailing partial content SHALL be covered by the background post-audit on the full accumulated response"
          - "if post_audit is disabled, the gateway SHALL record in the audit log that the trailing partial content was not window-detected (partial_coverage: true)"
          - "the data: [DONE] SHALL be sent without waiting for any synchronous detection of the partial buffer"
          - "no window SHALL be triggered until the buffer accumulates window_size characters"

  - id: REQ-003
    description: "窗口检测 block 时立即停止转发，发送 safety_block SSE 事件 + data: [DONE]"
    scenarios:
      - id: SC-006
        confidence: high
        evidence: "proposal.yaml -> what_changes C3, success_criteria; design.md -> Decision 3; DESIGN.md -> Section 8.2 table"
        given: "a window detection returns action=block with a toxicity detector at high risk_level"
        when: "the gateway evaluates the window result"
        then: "the gateway SHALL immediately stop forwarding further provider chunks to the client"
        and:
          - "the gateway SHALL send a safety_block SSE event with fields blocked_by, category, risk_level, confidence, and reason"
          - "the gateway SHALL send data: [DONE] after the safety_block event"
          - "no further content chunks SHALL be forwarded after the block decision"
          - "the final_action SHALL be recorded as block in the audit log"
      - id: SC-007
        confidence: high
        evidence: "proposal.yaml -> what_changes C3; DESIGN.md -> Section 8.2 (block prevents harmful content)"
        given: "a block decision occurs at window N and the provider continues to send chunks for windows N+1"
        when: "the gateway has emitted safety_block and [DONE]"
        then: "the gateway SHALL terminate the generator and stop consuming further provider chunks"
        and:
          - "the client SHALL not receive any content chunks after the block event"

  - id: REQ-004
    description: "窗口检测 flag 时继续流式，send_flag_events=true 时发送 safety_flag SSE 事件（每窗口一条，多检测器聚合为最高 risk_level + 逗号分隔 flagged_by）"
    scenarios:
      - id: SC-008
        confidence: high
        evidence: "proposal.yaml -> what_changes C3, success_criteria; design.md -> Decision 3; DESIGN.md -> Section 8.2, 4.3"
        given: "a window detection returns action=flag from a single detector (pii_redaction) and send_flag_events=true"
        when: "the gateway evaluates the window result"
        then: "the gateway SHALL continue streaming the window content to the client"
        and:
          - "the gateway SHALL send one safety_flag SSE event for that window with flagged_by=pii_redaction"
          - "the gateway SHALL record the flag in the audit log"
      - id: SC-009
        confidence: high
        evidence: "proposal.yaml -> success_criteria; design.md -> Decision 3; DESIGN.md -> Section 8.2 (event granularity)"
        given: "two detectors (pii_redaction, toxicity) both return flag for the same window with risk_levels medium and high respectively, and send_flag_events=true"
        when: "the gateway aggregates the window results into a safety_flag event"
        then: "the gateway SHALL emit exactly one safety_flag event for the window"
        and:
          - "flagged_by SHALL be a comma-separated list, e.g., \"pii_redaction,toxicity\""
          - "risk_level SHALL reflect the highest value among flagging detectors (high)"
          - "the stream SHALL continue normally after emitting the safety_flag event"
      - id: SC-010
        confidence: medium
        evidence: "proposal.yaml -> what_changes C3; design.md -> Decision 3; DESIGN.md -> Section 4.3 (send_flag_events default off)"
        given: "a window detection returns action=flag and send_flag_events=false (default)"
        when: "the gateway evaluates the window result"
        then: "the gateway SHALL continue streaming without emitting a safety_flag SSE event"
        and:
          - "the flag SHALL still be recorded in the audit log"

  - id: REQ-005
    description: "窗口检测 modify 降级为 flag（tokens 已转发），审计记录 action: modify, applied: false"
    scenarios:
      - id: SC-011
        confidence: high
        evidence: "proposal.yaml -> what_changes C3, success_criteria; design.md -> Decision 3; DESIGN.md -> Section 8.2 (modify note)"
        given: "a window detection returns action=modify from an output detector and the window tokens have already been forwarded to the client"
        when: "the gateway processes the modify action in sliding_window mode"
        then: "the gateway SHALL downgrade the modify action to flag"
        and:
          - "the gateway SHALL continue streaming (no modification is applied to the already-sent tokens)"
          - "the audit log SHALL record action=modify and applied=false"
          - "if send_flag_events=true, the gateway SHALL emit a safety_flag event for that window"

  - id: REQ-006
    description: "buffer 模式——缓冲完整 Provider 响应后执行检测，再以 SSE chunks 回放给客户端"
    scenarios:
      - id: SC-012
        confidence: high
        evidence: "proposal.yaml -> what_changes C7, constraints (buffer 模式 post-audit 自动跳过); design.md -> Decision 7; DESIGN.md -> Section 8.2 (buffer mode)"
        given: "streaming.mode is buffer and a provider returns a complete SSE response"
        when: "the gateway buffers the entire provider response and runs detection once"
        then: "the gateway SHALL buffer the full response before sending any content chunk to the client"
        and:
          - "after detection passes (allow), the gateway SHALL replay the original SSE chunks to the client in order, preserving the SSE protocol contract (data: {chunk} ... data: [DONE])"
          - "post-audit SHALL be automatically skipped, recording post_audit.executed=false with reason=buffer_mode"
      - id: SC-013
        confidence: high
        evidence: "proposal.yaml -> what_changes C7; design.md -> Decision 7; DESIGN.md -> Section 8.2 (buffer block)"
        given: "streaming.mode is buffer and the buffered response is detected as block"
        when: "the gateway runs detection on the buffered response"
        then: "the gateway SHALL not send any content chunks to the client"
        and:
          - "the gateway SHALL send a safety_block SSE event followed by data: [DONE]"

  - id: REQ-007
    description: "max_response_size 限制（默认 1MB），on_max_size block（safety_block + [DONE], blocked_by: streaming_limit, category: response_too_long, risk_level: medium, confidence: 1.0）或 truncate（停止累积继续流式）"
    scenarios:
      - id: SC-014
        confidence: high
        evidence: "proposal.yaml -> what_changes C4, success_criteria; design.md -> Decision 4; DESIGN.md -> Section 8.5"
        given: "streaming config has max_response_size=1MB and on_max_size=block"
        when: "the accumulated response size exceeds max_response_size"
        then: "the gateway SHALL stop streaming and send a safety_block SSE event"
        and:
          - "the safety_block event SHALL include blocked_by=streaming_limit, category=response_too_long, risk_level=medium, confidence=1.0, and a reason referencing the size limit"
          - "the gateway SHALL send data: [DONE] after the safety_block event"
          - "no further content chunks SHALL be forwarded"
      - id: SC-015
        confidence: high
        evidence: "proposal.yaml -> what_changes C4; design.md -> Decision 4; DESIGN.md -> Section 8.5 (truncate)"
        given: "streaming config has on_max_size=truncate"
        when: "the accumulated response size exceeds max_response_size"
        then: "the gateway SHALL stop accumulating additional content but continue streaming provider chunks to the client"
        and:
          - "the audit log SHALL record post_audit_truncated=true"
          - "post-audit SHALL run on the truncated accumulated content"
      - id: SC-016
        confidence: medium
        evidence: "design.md -> Decision 4; DESIGN.md -> Section 8.5 (size estimation)"
        given: "responses contain UTF-8 Chinese characters"
        when: "the gateway estimates the accumulated response size for max_response_size comparison"
        then: "the gateway SHALL account for UTF-8 encoding (e.g., 3 bytes per Chinese character) when comparing to the byte-based limit"

  - id: REQ-008
    description: "检测器在流式中并行执行，任一 block 时短路（复用 PipelineEngine）"
    scenarios:
      - id: SC-017
        confidence: high
        evidence: "proposal.yaml -> what_changes C2, risk_areas mitigation; design.md -> Decision 2, Decision 5; DESIGN.md -> Section 8.2"
        given: "a window is full and multiple output detectors are enabled"
        when: "the gateway runs window detection via the PipelineEngine"
        then: "the gateway SHALL execute all output detectors for the window in parallel"
        and:
          - "if any detector returns block, the gateway SHALL short-circuit and immediately apply the block decision"
          - "the window result SHALL be aggregated into a single final action"
      - id: SC-018
        confidence: medium
        evidence: "proposal.yaml -> what_changes C2; design.md -> Risk (流式延迟) mitigation"
        given: "the PipelineEngine is reused for both sliding-window and post-audit detection"
        when: "the gateway invokes detection for a window"
        then: "the gateway SHALL reuse the existing PipelineEngine rather than implementing duplicate detection logic"
        and:
          - "the detection result SHALL include per-detector action, confidence, risk_level, and duration"

  - id: REQ-009
    description: "SSE 事件格式——OpenAI 标准 data: {chunk} 事件 + 自定义 safety_block/safety_flag 事件 + data: [DONE]"
    scenarios:
      - id: SC-019
        confidence: high
        evidence: "proposal.yaml -> what_changes C1, C3; design.md -> Decision 3; DESIGN.md -> Section 4.3, 8.1"
        given: "a streaming request completes safely with no risk detected"
        when: "the gateway forwards the provider stream to the client"
        then: "the client SHALL receive standard OpenAI SSE events: data: {chunk} for each token and a final data: [DONE]"
        and:
          - "no custom safety event SHALL be injected when no risk is detected"
      - id: SC-020
        confidence: high
        evidence: "proposal.yaml -> what_changes C3; DESIGN.md -> Section 4.3 (event types)"
        given: "a mid-stream block decision occurs and send_flag_events=true with a flag decision also occurring"
        when: "the gateway emits safety events"
        then: "the gateway SHALL use event: safety_block and event: safety_flag for the custom safety events, each followed by an associated data payload"
        and:
          - "the safety_block and safety_flag data payloads SHALL be valid JSON containing request_id and risk fields"
          - "the stream SHALL always terminate with data: [DONE] regardless of whether it completed normally or was blocked"
      - id: SC-021
        confidence: medium
        evidence: "DESIGN.md -> Section 4.3 (safety_flag format)"
        given: "send_flag_events=true and a single detector flags a window"
        when: "the gateway emits a safety_flag event"
        then: "the safety_flag data payload SHALL contain flagged_by, category, risk_level, confidence, and message fields"
  - id: REQ-SSE-001
    description: "SSE 分片行缓冲重组：SSEBuffer 按 \\n\\n 边界跨 chunk 拼接不完整事件，消除流式漏检（B-03）"
    scenarios:
      - id: SC-SSE-001
        confidence: high
        evidence: "backlog B-03; design Decision 14; DESIGN 8.2"
        given: "provider 通过 stream_forward 的 aiter_text() 按网络分片 yield，单个 `data:{json}\\n\\n` SSE 事件被拆散到两个相邻 chunk"
        when: "SSEBuffer 接收第一段不完整事件后接收第二段补齐 `\\n\\n` 边界"
        then: "SSEBuffer SHALL 在 `\\n\\n` 边界处重组出完整的单个 SSE 事件，并交给 _extract_delta_text 解析出 delta 文本"
        and:
          - "重组后的事件内容 SHALL 与原始事件完全一致，不丢失、不重复任何字节"
          - "该 delta 文本 SHALL 进入滑动窗口检测，不再因分片而判定为空窗口"
      - id: SC-SSE-002
        confidence: high
        evidence: "backlog B-03; design Decision 14; DESIGN 8.2"
        given: "单个 chunk 内包含多个以 `\\n\\n` 分隔的完整 SSE 事件"
        when: "SSEBuffer 处理该 chunk"
        then: "SSEBuffer SHALL 一次性产出全部完整事件，并按原始顺序逐条交付"
        and:
          - "事件之间的分界 SHALL 严格以 `\\n\\n` 为准，不以行数或固定长度猜测"
      - id: SC-SSE-003
        confidence: medium
        evidence: "backlog B-03; design Decision 14; DESIGN 8.2"
        given: "流接近结束，缓冲区内残留一段未以 `\\n\\n` 结尾的不完整事件"
        when: "stream_forward 迭代完毕进入结束处理"
        then: "SSEBuffer SHALL 在结束时 flush 残留内容并解析，避免末尾分片内容被静默丢弃导致漏检"
        and:
          - "若残留片段确为完整 JSON 负载，SHALL 仍被检测并透传"
          - "若为协议终止标记（如 `[DONE]`），SHALL 透传且不引发解析异常"
      - id: SC-SSE-004
        confidence: high
        evidence: "backlog B-03; design Decision 14; DESIGN 8.2"
        given: "流中出现非 data 事件（如 `event: safety_block`、`data: [DONE]`）"
        when: "这些事件被跨 chunk 拆分或与 data 事件混在同一个 chunk"
        then: "SSEBuffer SHALL 按 `\\n\\n` 边界正确切分并原样透传非 data 事件，不改变其类型与负载"
        and:
          - "安全事件与终止标记 SHALL 不受缓冲重组影响，保持客户端可识别"
  - id: REQ-SSE-002
    description: "输出侧 output_action/output_risk_level 单独维护，流式审计使用输出侧真实结果而非输入侧（B-05）"
    scenarios:
      - id: SC-SSE-005
        confidence: high
        evidence: "backlog B-05; design Decision 15; DESIGN 12.1"
        given: "StreamingHandler 在滑动窗口模式运行，逐个窗口执行输出侧检测"
        when: "每个窗口产生 PipelineResult"
        then: "handler SHALL 独立维护输出侧 output_action 与 output_risk_level（取自滑动窗口 final_action / overall_risk_level）"
        and:
          - "output_action 随每次检测结果按严重度升序聚合（allow < flag < modify < block）"
          - "output_risk_level SHALL 取所有已检测窗口的最高风险等级"
      - id: SC-SSE-006
        confidence: high
        evidence: "backlog B-05; design Decision 15; DESIGN 12.1"
        given: "流式检测途中某个窗口 final_action == block"
        when: "handler 发出 safety_block 事件并停止透传"
        then: "输出侧 output_action SHALL 置为 block，output_risk_level 取该阻断窗口的风险等级，并记录触发 detector 与 category"
        and:
          - "最终审计条目 SHALL 记录 final_action=block 及对应 blocked_by / category / confidence / reason"
      - id: SC-SSE-007
        confidence: high
        evidence: "backlog B-05; design Decision 15; DESIGN 12.1"
        given: "同一请求的输入侧 request.state.safety_action 与输出侧检测结果可能不同"
        when: "构建流式输出审计条目"
        then: "流式输出审计 SHALL 使用输出侧 output_action / output_risk_level，而不再读取输入侧 request.state.safety_action"
        and:
          - "当输出侧被阻断而输入侧为 allow 时，审计 SHALL 记录 block 而非 allow"
  - id: REQ-SSE-003
    description: "后审计 detector_results 与 window_count 写入审计条目，消除 detectors 恒空与 window_count 恒 0（B-06）"
    scenarios:
      - id: SC-SSE-008
        confidence: high
        evidence: "backlog B-06; design Decision 15; DESIGN 12.1"
        given: "PostAuditRunner.run() 对完整累积内容执行深检并产生 detector_results"
        when: "该结果被写入流式输出审计条目"
        then: "审计条目的 detectors 数组 SHALL 包含后置审计的完整检测器结果（name/action/confidence/risk_level）"
        and:
          - "detectors SHALL 不再恒为空数组"
          - "post_audit 字典 SHALL 保留 effective_action / original_action / risk_level 等既有字段"
      - id: SC-SSE-009
        confidence: high
        evidence: "backlog B-06; design Decision 15; DESIGN 8.2"
        given: "handler 在 process_chunk 循环中逐窗口执行检测"
        when: "每次消费并检测一个完整窗口"
        then: "handler SHALL 累加窗口计数，并在审计时以实际值填充 window_count（不再恒为占位 0）"
        and:
          - "window_count SHALL 等于本次流式会话实际检测的窗口总数"
          - "window_count 仅对流式（streaming=True）条目有效，非流式条目不受影响"
  - id: REQ-SSE-004
    description: "PostAuditRunner 与 handler 透传 request_id 与输入侧 language，复用语言上下文（B-07 / DESIGN 6.6）"
    scenarios:
      - id: SC-SSE-010
        confidence: high
        evidence: "backlog B-07; design Decision 15; DESIGN 6.6"
        given: "后置审计被触发，当前请求持有非空 request_id"
        when: "调用 PostAuditRunner.run(content, request_id=..., language=...)"
        then: "PostAuditRunner SHALL 接收并在构建 DetectionContext 时透传 request_id，不再硬编码空字符串"
        and:
          - "后置审计生成的 DetectionContext.request_id SHALL 等于当前请求 request_id"
      - id: SC-SSE-011
        confidence: high
        evidence: "backlog B-07; design Decision 15; DESIGN 6.6"
        given: "输入侧已检测出 language（如 detect_language_for_messages 的返回）"
        when: "handler 为滑动窗口与后置审计构建 DetectionContext"
        then: "handler SHALL 接收输入侧 language 并写入 DetectionContext.language"
        and:
          - "滑动窗口与后置审计 SHALL 复用输入侧语言，不重新检测"
      - id: SC-SSE-012
        confidence: medium
        evidence: "backlog B-07; design Decision 15; DESIGN 12.1"
        given: "流式输出审计条目构建时存在输入侧 language"
        when: "写入 AuditEntry"
        then: "流式输出审计条目的 language SHALL 采用输入侧 language"
        and:
          - "当输入侧未检测出语言时，language SHALL 保持 None，不产生伪值"
  - id: REQ-SSE-005
    description: "修正不引入回归：透明透传、缓冲模式、错误路径与既有流式协议保持兼容"
    scenarios:
      - id: SC-SSE-013
        confidence: high
        evidence: "backlog B-03/B-05/B-06/B-07; design Decision 14/15; DESIGN 8.2"
        given: "未配置输出检测器（has_detection=False）"
        when: "发起流式请求"
        then: "网关 SHALL 保持透明透传，逐 chunk 转发并在末尾发出 [DONE]"
        and:
          - "该路径 SHALL 不执行 SSEBuffer 重组、滑动窗口或后置审计，行为与修正前一致"
      - id: SC-SSE-014
        confidence: medium
        evidence: "backlog B-06; design Decision 15; DESIGN 8.2"
        given: "streaming_config.mode == buffer 且配置了输出检测器"
        when: "缓冲模式完成全量检测并回放 buffered chunk"
        then: "缓冲模式 SHALL 保持既有行为（全量检测后 block 或回放 + [DONE]），且其审计仍使用该模式的结果"
        and:
          - "window_count 与 SSEBuffer 重组 SHALL 仅作用于滑动窗口模式，不影响 buffer 模式"
      - id: SC-SSE-015
        confidence: medium
        evidence: "backlog B-05/B-06; design Decision 15; DESIGN 12.1"
        given: "provider 在流中抛出 ProviderError"
        when: "滑动窗口模式捕获异常并发出 error 事件 + [DONE]"
        then: "错误路径 SHALL 仍输出事件序列 error + [DONE]，并照常记录审计条目"
        and:
          - "错误路径审计的 final_action / final_risk_level SHALL 反映实际（allow/未被阻断时的输出侧状态），不因修正而写入虚假 block"
          - "审计条目的 detector_results 与 window_count SHALL 以实际处理结果为准，缺失时保持空/None 而非伪造"
