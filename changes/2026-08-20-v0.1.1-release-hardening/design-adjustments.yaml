meta:
  change_id: "2026-08-20-v0.1.1-release-hardening"
  created: "2026-08-21T10:26:00+08:00"
  total_adjustments: 8
  requires_re_spec: false
  requires_re_build: false

adjustments:
  - id: "ADJ-001"
    phase: "verify"
    type: "support-boundary"
    status: "accepted"
    original: "D5 保持 requires-python >=3.10"
    actual: "gateway 与 SDK 均声明 requires-python >=3.10,<3.13"
    rationale: "公开支持范围明确为 3.10-3.12，避免 pip 在未经验证的 3.13+ 上接受安装"
  - id: "ADJ-002"
    phase: "verify"
    type: "release-safety"
    status: "accepted"
    original: "Release 仅依赖 build 与 audit"
    actual: "CI 作为 workflow_call 复用，Release 同时依赖 quality、build、audit"
    rationale: "tag 所指提交必须先通过 Ruff、Mypy、pytest、覆盖率和三版本矩阵"
  - id: "ADJ-003"
    phase: "verify"
    type: "workflow-clarification"
    status: "accepted"
    original: "workflow_dispatch 暴露 dry_run 布尔输入"
    actual: "手动运行天然只验证，不保留无语义的 dry_run 输入"
    rationale: "release job 的 tag-only 条件已经禁止手动发布，删除死配置避免误解"
  - id: "ADJ-004"
    phase: "verify"
    type: "deployment-hardening"
    status: "accepted"
    original: "D10 要求静态 Compose 校验和最小运行冒烟"
    actual: "生产 Compose 构建真实示例 sidecar，等待 service_healthy，验证双副本与 3/3 detectors ready"
    rationale: "静态 endpoint 与 liveness 不能证明 gRPC runtime、sidecar 和安全能力真实生效"
  - id: "ADJ-005"
    phase: "verify"
    type: "distribution-channel"
    status: "accepted"
    original: "插件文档示例使用普通 SDK 包版本范围"
    actual: "v0.1.1 使用 GitHub Release SDK wheel direct reference，并允许 Hatch direct references"
    rationale: "本 change 明确不发布 PyPI，文档与脚手架必须指向实际可用的分发渠道"
  - id: "ADJ-006"
    phase: "verify"
    type: "quality-configuration"
    status: "accepted"
    original: "STDD quality.test 同时承担覆盖率诊断和 90% 发布硬门"
    actual: "quality.test 使用 fail-under=0 诊断，quality.release_test 保留 90% 硬门"
    rationale: "与 Verify skill 的诊断语义一致，同时不削弱 CI/发布门禁"
  - id: "ADJ-007"
    phase: "verify"
    type: "governance-channel"
    status: "accepted"
    original: "行为准则复用漏洞 advisory 私密入口"
    actual: "行为准则使用独立 moderation 请求流程，漏洞 advisory 仅处理安全漏洞"
    rationale: "行为事件与软件漏洞的处置权限、内容和保密流程不同"
  - id: "ADJ-008"
    phase: "verify"
    type: "process-compatibility"
    status: "accepted"
    original: "Verify skill 宣称 12 类但 vendored v2.9.5 正文仅定义 a-k 11 类"
    actual: "保留上游哈希不修改，将 l 明确定义为独立 L3 锚定缺失检查"
    rationale: "既完成项目要求的 12 类检查，又不破坏固定来源 vendored CLI/skill 完整性"
