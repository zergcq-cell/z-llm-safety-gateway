meta:
  task_id: "config-system"
  change_id: "2026-08-11-v0.1.0-framework-skeleton"
  task_type: code
  system: "z LLM Safety Gateway"
  preconditions:
    - "Python 3.12+ environment is available"
    - "Project dependencies (pydantic v2, pyyaml) are installed"
    - "No existing source code (Phase 1 greenfield project)"
    - "Test fixture YAML config files are available in tests/fixtures/"

steps:
  - id: CP-1
    description: "Verify YAML config is loaded via yaml.safe_load and returns a dict (SC-001)"
    action: "Run pytest test that loads a valid YAML config fixture and asserts the return type is dict with expected top-level keys"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-2
    description: "Verify YAML syntax error is caught before Pydantic validation (SC-002)"
    action: "Run pytest test that loads a syntactically invalid YAML file and asserts a parse error is raised, not a Pydantic ValidationError"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-3
    description: "Verify ${VAR_NAME} interpolation replaces env var values before Pydantic validation (SC-003)"
    action: "Run pytest test that sets OPENAI_API_KEY env var, loads a config with ${OPENAI_API_KEY}, and asserts the resolved value appears in the validated config"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-4
    description: "Verify unset env var resolves to empty string, not crash (SC-004)"
    action: "Run pytest test that loads a config with ${UNSET_VAR} (no env var set), and asserts interpolation produces empty string without raising"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-5
    description: "Verify Pydantic v2 models validate all config sections (SC-005)"
    action: "Run pytest test that validates a fully valid config dict and asserts a GatewayConfig instance is returned with all sub-sections typed"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-6
    description: "Verify Pydantic rejects type mismatches (SC-006)"
    action: "Run pytest test that validates a config with server.port='not_a_number' and asserts a Pydantic ValidationError is raised for the type mismatch"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-7
    description: "Verify block_threshold <= flag_threshold is rejected (SC-007)"
    action: "Run pytest test that validates a detector config with block_threshold=0.50 and flag_threshold=0.85, and asserts a validation error is raised"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-8
    description: "Verify block_threshold > flag_threshold is accepted (SC-008)"
    action: "Run pytest test that validates a detector config with block_threshold=0.85 and flag_threshold=0.50, and asserts no validation error is raised"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-9
    description: "Verify equal thresholds are rejected (SC-009)"
    action: "Run pytest test that validates a detector config with block_threshold=0.85 and flag_threshold=0.85, and asserts a validation error is raised"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-10
    description: "Verify overlapping routing rules produce a startup warning (SC-010)"
    action: "Run pytest test that validates a config with overlapping routing patterns 'gpt-4*' and 'gpt-*', and asserts a warning is emitted (using pytest.warns or caplog)"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-11
    description: "Verify non-overlapping routing rules produce no warning (SC-011)"
    action: "Run pytest test that validates a config with non-overlapping routing patterns 'gpt-4*' and 'llama*', and asserts no overlap warning is emitted"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-12
    description: "Verify invalid config raises ConfigValidationError with clear message (SC-012)"
    action: "Run pytest test that loads an invalid config and asserts ConfigValidationError is raised with field-level error details"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-13
    description: "Verify YAML syntax error prevents startup with location info (SC-013)"
    action: "Run pytest test that loads a YAML file with unbalanced brackets and asserts the error message includes syntax error information"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-14
    description: "Verify missing api_key for openai provider raises error (SC-014)"
    action: "Run pytest test that validates a config with an openai provider lacking api_key, and asserts a validation error mentioning provider 'openai' and field 'api_key'"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-15
    description: "Verify openai_compatible provider without api_key is accepted (SC-015)"
    action: "Run pytest test that validates a config with an openai_compatible provider having base_url but no api_key, and asserts no validation error is raised for the missing api_key"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-16
    description: "Verify unset env var resolves to empty string without exception (SC-016)"
    action: "Run pytest test that loads a config with ${TOTALLY_UNSET_VAR} and asserts the interpolation step completes without raising KeyError or any exception"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-17
    description: "Verify multiple env var references resolved in single recursive pass (SC-017)"
    action: "Run pytest test that loads a config with mixed set and unset env var references at various nesting levels, and asserts all are resolved correctly"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-18
    description: "Run full test suite for config-system capability"
    action: "Run: pytest tests/unit/config/ -v"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-19
    description: "Run lint and type checks"
    action: "Run: ruff check src/z_llm_safety_gateway/config/ && mypy src/z_llm_safety_gateway/config/"
    assertions:
      - type: exit_code
        expected: 0

rollback:
  steps:
    - "Revert all changes to src/z_llm_safety_gateway/config/ directory (loader.py, models.py, validators.py)"
    - "Remove any test files added for config-system capability"
    - "Reinstall the package if needed: pip install -e ."
