meta:
  task_id: "fastapi-server"
  change_id: "2026-08-11-v0.1.0-framework-skeleton"
  task_type: code
  system: "z LLM Safety Gateway"
  preconditions:
    - "Python 3.12+ environment is available"
    - "Project dependencies (FastAPI, httpx, pydantic, structlog) are installed"
    - "config-system capability is implemented (create_app depends on config loading)"
    - "provider-proxy capability is implemented (chat completions forwards to provider)"
    - "A valid test config file (gateway.yaml) exists for testing"

steps:
  - id: CP-1
    description: "Verify create_app factory returns a FastAPI instance with registered routes (SC-001)"
    action: "Run pytest test that calls create_app(valid_config_path) and inspects the returned app's route table"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "test_create_app_returns_fastapi_instance"

  - id: CP-2
    description: "Verify create_app raises on missing config file (SC-002)"
    action: "Run pytest test that calls create_app('/nonexistent/config.yaml') and asserts an exception is raised"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-3
    description: "Verify POST /v1/chat/completions forwards request to provider and returns response (SC-003)"
    action: "Run pytest integration test with a mock provider that returns a 200 response; send POST to /v1/chat/completions with model matching a routing rule"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "200"

  - id: CP-4
    description: "Verify POST /v1/chat/completions returns 404 model_not_found for unmatched model (SC-004)"
    action: "Run pytest test that sends POST to /v1/chat/completions with a model matching no routing rule; assert response status is 404 and body contains model_not_found"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-5
    description: "Verify POST /v1/chat/completions returns 400 for invalid JSON body (SC-005)"
    action: "Run pytest test that sends POST to /v1/chat/completions with a malformed JSON body; assert response status is 400"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-6
    description: "Verify GET /v1/models forwards to first provider and returns model list as-is (SC-006)"
    action: "Run pytest integration test with a mock provider; send GET to /v1/models; assert response matches provider model list"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-7
    description: "Verify server binds to configured host:port (SC-007)"
    action: "Run pytest test that starts the server via TestClient on a config with host 127.0.0.1 port 8080; assert the server accepts connections"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-8
    description: "Verify app factory is importable without starting server (SC-008)"
    action: "Run pytest test that imports create_app from z_llm_safety_gateway.app and asserts no server starts on import"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-9
    description: "Verify provider 5xx error is wrapped as HTTP 502 provider_error (SC-009)"
    action: "Run pytest test with a mock provider returning 500; send POST to /v1/chat/completions; assert response status is 502 and body type is provider_error"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-10
    description: "Verify provider timeout is wrapped as HTTP 502 provider_error (SC-010)"
    action: "Run pytest test with a mock provider that times out; send POST to /v1/chat/completions; assert response status is 502 and body type is provider_error"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-11
    description: "Verify provider 4xx error is wrapped as HTTP 502 provider_error (SC-011)"
    action: "Run pytest test with a mock provider returning 401; send POST to /v1/chat/completions; assert response status is 502, body type is provider_error, and details include provider status"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-12
    description: "Verify ConfigError is wrapped as HTTP 500 internal_error (SC-012)"
    action: "Run pytest test that triggers a ConfigError within a route; assert response status is 500, type is internal_error, and code is config_error"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-13
    description: "Verify unhandled Exception is wrapped as HTTP 500 internal_error (SC-013)"
    action: "Run pytest test that raises a generic Exception within a route; assert response status is 500 and type is internal_error"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-14
    description: "Run full test suite for fastapi-server capability"
    action: "Run: pytest tests/ -k 'fastapi or app or routes or chat or models_endpoint' -v"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-15
    description: "Run lint and type checks"
    action: "Run: ruff check src/z_llm_safety_gateway/app.py src/z_llm_safety_gateway/routes/ && mypy src/z_llm_safety_gateway/app.py src/z_llm_safety_gateway/routes/"
    assertions:
      - type: exit_code
        expected: 0

rollback:
  steps:
    - "Revert all changes to src/z_llm_safety_gateway/app.py and src/z_llm_safety_gateway/routes/"
    - "Remove any test files added for fastapi-server capability"
    - "Reinstall the package if needed: pip install -e ."
