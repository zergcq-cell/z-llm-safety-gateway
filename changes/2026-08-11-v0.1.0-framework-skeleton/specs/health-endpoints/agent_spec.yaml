# agent_spec.yaml - Agent 验证规格（Canonical YAML）
# Capability: health-endpoints
# Change: 2026-08-11-v0.1.0-framework-skeleton

meta:
  task_id: "health-endpoints"
  change_id: "2026-08-11-v0.1.0-framework-skeleton"
  task_type: code
  system: "z LLM Safety Gateway"
  preconditions:
    - "Python 3.12+ 环境已安装"
    - "项目依赖已安装（FastAPI, httpx, Pydantic v2, pytest, pytest-asyncio）"
    - "src/z_llm_safety_gateway/routes/health.py 模块已实现"
    - "src/z_llm_safety_gateway/app.py app factory 已创建并注册 health 路由"
    - "RequestID 中间件已注册到 app"

steps:
  - id: CP-1
    description: "验证 liveness 探针 GET /health 返回 200 和 {\"status\": \"healthy\"}"
    action: "pytest tests/unit/routes/test_health.py::test_health_returns_healthy -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-2
    description: "验证 readiness 探针 GET /ready 在服务器就绪时返回 200 和 {\"status\": \"ready\"}"
    action: "pytest tests/unit/routes/test_health.py::test_ready_returns_ready_when_ready -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-3
    description: "验证 readiness 探针 GET /ready 在服务器未就绪时返回 503 和 {\"status\": \"not_ready\"}"
    action: "pytest tests/unit/routes/test_health.py::test_ready_returns_not_ready_when_not_ready -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-4
    description: "验证 GET /metrics 返回 200 和 text/plain 内容类型"
    action: "pytest tests/unit/routes/test_health.py::test_metrics_returns_200_text_plain -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-5
    description: "验证 GET /metrics Phase 1 响应 body 为占位文本"
    action: "pytest tests/unit/routes/test_health.py::test_metrics_placeholder_body -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-6
    description: "验证健康检查端点不需要认证"
    action: "pytest tests/unit/routes/test_health.py::test_health_endpoints_no_auth_required -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-7
    description: "验证 GET /health 响应包含 X-Request-ID 头"
    action: "pytest tests/unit/routes/test_health.py::test_health_response_has_request_id -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-8
    description: "验证 GET /ready 响应包含 X-Request-ID 头"
    action: "pytest tests/unit/routes/test_health.py::test_ready_response_has_request_id -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-9
    description: "验证 GET /metrics 响应包含 X-Request-ID 头"
    action: "pytest tests/unit/routes/test_health.py::test_metrics_response_has_request_id -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-10
    description: "运行 ruff lint 检查 health 路由模块"
    action: "ruff check src/z_llm_safety_gateway/routes/health.py tests/unit/routes/test_health.py"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-11
    description: "运行 mypy 类型检查 health 路由模块"
    action: "mypy src/z_llm_safety_gateway/routes/health.py"
    assertions:
      - type: exit_code
        expected: 0

rollback:
  steps:
    - "删除 src/z_llm_safety_gateway/routes/health.py"
    - "删除 tests/unit/routes/test_health.py"
    - "从 app.py 中移除 health 路由注册"
