meta:
  task_id: tenant-config-contract
  change_id: 2026-09-01-tenant-flow-policy-resolution
  task_type: code
  system: Strict tenant policy declarations and startup reference validation
  preconditions:
    - The prior trusted tenant identity contract remains passing.
    - Tests precede model and validator changes.
steps:
  - id: CP-TCC-008
    description: Valid strict policies expose explicit stages, bindings, result policy, and routing.
    action: .venv/bin/pytest tests/unit/config/test_tenant_policies.py::test_valid_strict_tenant_policy_schema -q
    assertions: [{type: exit_code, expected: 0}]
  - id: CP-TCC-009
    description: Shared policies compile once and policy/binding/rule limits fail deterministically.
    action: .venv/bin/pytest tests/unit/config/test_tenant_policies.py::test_policy_reuse_and_declaration_limits -q
    assertions: [{type: exit_code, expected: 0}]
  - id: CP-TCC-010
    description: Missing, duplicate, and unknown policy identities fail closed.
    action: .venv/bin/pytest tests/unit/config/test_tenant_policies.py::test_policy_identity_failures_use_stable_codes -q
    assertions: [{type: exit_code, expected: 0}]
  - id: CP-TCC-011
    description: Flow and capability binding ambiguities fail before startup.
    action: .venv/bin/pytest tests/unit/config/test_tenant_policy_validation.py::test_tenant_policy_flow_and_binding_references_fail_closed -q
    assertions: [{type: exit_code, expected: 0}]
  - id: CP-TCC-012
    description: Provider route and models-provider ambiguities fail without secrets.
    action: .venv/bin/pytest tests/unit/config/test_tenant_policy_validation.py::test_tenant_policy_routing_references_fail_closed -q
    assertions: [{type: exit_code, expected: 0}]
  - id: CP-TCC-013
    description: Tenant and global execution selectors cannot coexist silently.
    action: .venv/bin/pytest tests/unit/config/test_tenant_policy_validation.py::test_tenant_and_global_execution_selectors_conflict -q
    assertions: [{type: exit_code, expected: 0}]
  - id: CP-TCC-014
    description: Disabled tenancy rejects policy fields and accepts unchanged legacy configuration.
    action: .venv/bin/pytest tests/unit/config/test_tenant_policies.py::test_disabled_tenancy_policy_compatibility -q
    assertions: [{type: exit_code, expected: 0}]
rollback:
  steps:
    - Revert policy schema and cross-reference validators without reverting the delivered identity schema.
    - Keep every RED failure matrix case for the next implementation attempt.
