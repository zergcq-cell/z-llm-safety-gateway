meta:
  task_id: default-detector-flow
  change_id: 2026-09-01-tenant-flow-policy-resolution
  task_type: code
  system: Tenant-selected Detector Flow execution and per-policy lifecycle isolation
  preconditions:
    - Existing default-detector-flow checkpoints remain passing.
    - Tenant runtime bundles have passed configuration validation.
steps:
  - id: CP-DDF-008
    description: Distinct tenant Flows produce their configured actions and Node policy behavior.
    action: .venv/bin/pytest tests/integration/test_tenant_policy_runtime.py::test_real_app_uses_tenant_flow_binding_and_router_bundle -q
    assertions: [{type: exit_code, expected: 0}]
  - id: CP-DDF-009
    description: Same Detector capability uses only its tenant thresholds, word list, and result policy.
    action: .venv/bin/pytest tests/unit/tenancy/test_runtime_bundle.py::test_policy_bundles_isolate_flow_binding_reducer_and_status -q
    assertions: [{type: exit_code, expected: 0}]
  - id: CP-DDF-010
    description: Input, output, streaming, and background stages share one tenant execution snapshot.
    action: .venv/bin/pytest tests/unit/routes/test_tenant_policy_snapshot.py tests/integration/test_tenant_policy_runtime.py::test_concurrent_requests_keep_sync_output_policy_snapshots_isolated tests/integration/test_tenant_policy_runtime.py::test_tenant_bundle_drives_streaming_output_paths tests/integration/test_tenant_policy_runtime.py::test_tenant_bundle_drives_async_output_and_recall -q
    assertions: [{type: exit_code, expected: 0}]
  - id: CP-DDF-011
    description: Same-named Detector lifecycle status is isolated per policy bundle.
    action: .venv/bin/pytest tests/unit/tenancy/test_runtime_bundle.py::test_policy_bundles_isolate_flow_binding_reducer_and_status tests/unit/tenancy/test_runtime_bundle.py::test_required_failure_rejects_all_bundles_and_cleans_up tests/integration/test_tenant_policy_runtime.py::test_ready_refreshes_every_tenant_registry tests/unit/routes/test_detector_readiness.py::test_ready_hides_other_tenant_detector_details tests/unit/routes/test_detector_readiness.py::test_ready_limits_health_check_concurrency -q
    assertions: [{type: exit_code, expected: 0}]
  - id: CP-DDF-012
    description: Flow core remains domain-neutral and aggregation remains a reducer capability.
    action: .venv/bin/pytest tests/integration/test_default_detector_flow.py::test_tc_ddf_007 -q
    assertions: [{type: exit_code, expected: 0}]
rollback:
  steps:
    - Revert per-policy bundle assembly and snapshot selection together.
    - Re-run all existing Flow Foundation checkpoints before retrying.
