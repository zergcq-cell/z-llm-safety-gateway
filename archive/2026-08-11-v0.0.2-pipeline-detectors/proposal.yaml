# proposal.yaml — Canonical 格式（AI 起草、AI 修改、AI 消费）
# Change: 2026-08-11-v0.2.0-pipeline-detectors

meta:
  change_id: "2026-08-11-v0.2.0-pipeline-detectors"
  title: "v0.2.0 - Pipeline & Detectors"
  created: "2026-08-11T10:00:00+08:00"
  status: confirmed

why:
  problem: >
    v0.1.0 搭建了框架骨架（FastAPI server、配置系统、Provider 代理、内容提取器），
    但请求流是纯透传——没有任何安全检测能力。extract_content() 和 apply_modifications()
    已实现但未接入请求流，pipeline.detectors 配置为空列表。
  motivation: >
    需要实现 Pipeline 引擎和 5 个 MVP 检测器，使网关具备实际的内容安全检测能力：
    输入检测（block/modify/flag/allow）→ 转发 → 输出检测。同时需要熔断器保护
    外部检测器调用的稳定性。

what_changes:
  - id: C1
    description: "新建 Pipeline 引擎：并行执行 + 短路机制（block/block_and_modify）+ 结果聚合 + Flag 升级 DSL + 错误处理（fail_open/fail_closed）"
    type: new
  - id: C2
    description: "新建检测器框架：Detector ABC（initialize/detect/health_check/shutdown）+ DetectionContext + DetectionResult + 注册机制"
    type: new
  - id: C3
    description: "新建熔断器：Closed → Open → Half-Open 状态机，按检测器可配置"
    type: new
  - id: C4
    description: "新建语言检测模块：langdetect，结果存入 DetectionContext.language"
    type: new
  - id: C5
    description: "实现 Prompt Injection 检测器：规则 + 模式匹配（MVP 不含 ML 模型）"
    type: new
  - id: C6
    description: "实现 PII 检测与脱敏检测器：正则模式（email/phone/ssn/credit_card/ip_address），redaction_mode: mask/replace/hash"
    type: new
  - id: C7
    description: "实现毒性检测器：ML 模型（unitary/toxic-bert），HuggingFace 懒加载 + 离线模式"
    type: new
  - id: C8
    description: "实现敏感词过滤检测器：Aho-Corasick 自动机，多语言词表，exact/fuzzy 匹配"
    type: new
  - id: C9
    description: "实现密钥泄露检测器：正则模式（api_key/aws_secret/private_key/jwt_token）"
    type: new
  - id: C10
    description: "重构配置系统：detectors 从 list[dict] 改为 {input: [...], output: [...]} 双向分组；扩展 pipeline 配置（short_circuit_on/flag_escalation/sync_timeout）"
    type: modified
  - id: C11
    description: "集成 Pipeline 到请求流：routes/chat.py 增加 input 检测 → block/modify/allow → 转发 → output 检测 → block/modify/allow"
    type: modified

capabilities:
  new:
    - name: pipeline-engine
      description: "并行检测器执行引擎，短路机制，结果聚合，Flag 升级规则 DSL，错误处理"
    - name: detector-framework
      description: "Detector 抽象基类，DetectionContext/DetectionResult 数据模型，注册与生命周期管理"
    - name: circuit-breaker
      description: "熔断器状态机（Closed/Open/Half-Open），外部检测器故障保护"
    - name: language-detection
      description: "基于 langdetect 的语言检测，ISO 639-1 代码输出"
    - name: prompt-injection-detector
      description: "规则 + 模式匹配检测 Prompt Injection 攻击"
    - name: pii-detector
      description: "PII 检测与脱敏（正则模式，支持 mask/replace/hash）"
    - name: toxicity-detector
      description: "基于 ML 模型的毒性检测，阈值驱动决策"
    - name: sensitive-words-detector
      description: "Aho-Corasick 多模式匹配，多语言词表"
    - name: secret-leak-detector
      description: "密钥/凭据泄露正则检测"
  modified:
    - name: config-system
      description: "检测器配置重构为 input/output 双向分组，pipeline 配置扩展"
    - name: fastapi-server
      description: "请求流集成 Pipeline（input 检测 → 转发 → output 检测）"

constraints:
  - "MVP 仅支持非流式 sync 模式（流式在 v0.3.0）"
  - "不实现 gRPC sidecar 检测器和进程内插件 entry points 发现（v0.5.0）"
  - "DetectionResult/Modification 定义在 gateway 内部（非独立 SDK 包，v0.5.0 提取为 z_llm_safety_gateway_sdk）"
  - "PII 检测器 MVP 使用正则模式，Microsoft Presidio 集成为可选增强"
  - "Prompt Injection 检测器 MVP 使用规则 + 模式匹配，ML 模型增强留待后续"
  - "ML 模型依赖较重（transformers + torch），需支持懒加载和离线模式"

stakeholders:
  - "网关使用者（应用程序开发者）"
  - "安全检测器开发者"
  - "系统运维工程师"

risk_areas:
  - capability: pipeline-engine
    risk: "并发执行 + 短路取消的竞态条件"
    mitigation: "使用 asyncio.Task 管理和 cancellation"
  - capability: toxicity-detector
    risk: "ML 模型下载失败/加载超时"
    mitigation: "懒加载 + on_error fail_open + offline_mode"
  - capability: config-system
    risk: "配置结构重构破坏 v0.1.0 向后兼容"
    mitigation: "保留旧字段兼容 + 配置迁移测试"
  - capability: fastapi-server
    risk: "请求流集成引入延迟"
    mitigation: "并行执行 + 短路 + 超时控制"

non_goals:
  - "流式 SSE 检测（v0.3.0）"
  - "滑动窗口检测（v0.3.0）"
  - "后审计检测（v0.3.0）"
  - "审计日志记录（v0.3.0）"
  - "gRPC sidecar 检测器（v0.5.0）"
  - "进程内插件 entry points 发现（v0.5.0）"
  - "检测器 SDK 独立包（v0.5.0）"
  - "认证/限流/TLS（v0.4.0）"

critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false

anchoring:
  level: L1
  reference_changes:
    - "2026-08-11-v0.1.0-framework-skeleton"
  anchor_implementations: []

success_criteria:
  - "Pipeline 引擎并行执行多个检测器，任一 block 时短路取消其余检测器"
  - "5 个 MVP 检测器各自正确检测对应风险类型（prompt injection/PII/toxicity/sensitive words/secret leak）"
  - "阈值驱动决策：confidence >= block_threshold → block，flag_threshold <= confidence < block_threshold → flag，否则 allow"
  - "检测器优先级决定 modify 应用顺序（priority 数字越小越先应用）"
  - "熔断器在连续失败后打开（跳过检测器），恢复超时后半开试探"
  - "语言检测结果存入 DetectionContext.language（ISO 639-1）"
  - "请求流集成：input 检测 → block(400)/modify(写回)/allow → 转发 → output 检测 → block(422)/modify(写回)/allow"
  - "Block 时返回 OpenAI 兼容错误响应（含 safety 扩展字段）"
  - "配置校验规则全部生效（阈值验证、未知检测器、缺失文件、flag_escalation 语法等）"
  - "fail_open/fail_closed 错误处理策略正确执行"
  - "全量测试通过，ruff/mypy 无错误"
