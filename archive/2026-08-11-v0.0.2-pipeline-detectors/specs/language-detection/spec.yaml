# spec.yaml — language-detection 行为规格
# 覆盖 DESIGN.md Section 6.6 语言检测的核心行为

meta:
  capability: "language-detection"
  change_id: "2026-08-11-v0.2.0-pipeline-detectors"
  created: "2026-08-11T10:00:00+08:00"
  confidence: high

requirements:
  - id: REQ-001
    description: "使用 langdetect 库对文本进行语言检测"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "design.md Architecture; DESIGN.md Section 6.6"
        given: "一段英文文本 content='Hello, how are you today?'"
        when: "LanguageDetector.detect(content) 被调用"
        then: "SHALL 使用 langdetect 库对文本进行语言检测"
        and:
          - "检测结果 SHALL 基于 langdetect 的概率分析返回"
          - "LanguageDetector SHALL 在 initialize 时完成 langdetect 的初始化"

  - id: REQ-002
    description: "语言检测结果返回 ISO 639-1 两字母语言代码"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "DESIGN.md Section 6.6"
        given: "一段中文文本 content='你好，今天天气怎么样？'"
        when: "LanguageDetector.detect(content) 被调用"
        then: "SHALL 返回 ISO 639-1 代码 'zh'"
        and:
          - "英文文本 SHALL 返回 'en'"
          - "日文文本 SHALL 返回 'ja'"
          - "返回代码 SHALL 为小写两字母字符串"

  - id: REQ-003
    description: "按消息独立检测，每条提取的消息单独进行语言检测"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "DESIGN.md Section 6.6"
        given: "一个包含 3 条消息的请求，消息语言分别为英文、中文、英文"
        when: "内容提取后对每条消息进行语言检测"
        then: "每条消息 SHALL 独立进行语言检测，各自获得独立的 language 值"
        and:
          - "第 1 条消息的 DetectionContext.language SHALL 为 'en'"
          - "第 2 条消息的 DetectionContext.language SHALL 为 'zh'"
          - "第 3 条消息的 DetectionContext.language SHALL 为 'en'"

  - id: REQ-004
    description: "语言检测结果存入 DetectionContext.language 字段，供检测器在执行时使用"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "design.md Architecture; DESIGN.md Section 6.6"
        given: "内容提取后语言检测返回 'zh'"
        when: "PipelineEngine 为该消息创建 DetectionContext"
        then: "DetectionContext.language SHALL 被设置为 'zh'"
        and:
          - "检测器 SHALL 可通过 context.language 读取语言信息"
          - "敏感词检测器 SHALL 根据 context.language 选择对应语言的词表"
          - "language 字段在 DetectionContext 创建时 SHALL 已被填充"

  - id: REQ-005
    description: "语言检测点在内容提取之后、pipeline 执行之前"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "design.md Architecture 请求流; DESIGN.md Section 6.6"
        given: "一个进入 /v1/chat/completions 的请求"
        when: "请求被路由处理"
        then: "执行顺序 SHALL 为：extract_content → language_detection → pipeline.run()"
        and:
          - "语言检测 SHALL 在 extract_content 完成后执行"
          - "语言检测 SHALL 在 PipelineEngine.run() 之前完成"
          - "所有检测器 SHALL 能在 detect() 中读取到已填充的 context.language"

  - id: REQ-006
    description: "空文本或检测失败时返回 None，不阻止请求处理"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "DESIGN.md Section 6.6"
        given: "空文本 content=''"
        when: "LanguageDetector.detect(content) 被调用"
        then: "SHALL 返回 None"
        and:
          - "DetectionContext.language SHALL 被设置为 None"
          - "空文本 SHALL 不触发异常"
          - "pipeline SHALL 继续正常执行"

      - id: SC-002
        confidence: medium
        evidence: "DESIGN.md Section 6.6"
        given: "langdetect 无法确定语言（如纯数字文本 content='12345'）抛出 LangDetectException"
        when: "LanguageDetector.detect(content) 捕获到异常"
        then: "SHALL 返回 None，不向上抛出异常"
        and:
          - "DetectionContext.language SHALL 被设置为 None"
          - "检测器 SHALL 优雅处理 language=None 的情况（如使用默认语言词表）"
          - "异常 SHALL 被记录为 warning 级别日志"
