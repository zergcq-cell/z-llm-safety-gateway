# agent_spec.yaml - Agent 验证规格（Canonical YAML）
# Capability: authentication
# Change: 2026-08-12-v0.4.0-security-observability

meta:
  task_id: "authentication"
  change_id: "2026-08-12-v0.4.0-security-observability"
  task_type: code
  system: "z LLM Safety Gateway"
  preconditions:
    - "Python 3.12+ 环境已安装"
    - "项目依赖已安装（FastAPI, httpx, Pydantic v2, pytest, pytest-asyncio）"
    - "config/models.py 已含 AuthConfig（security.auth.enabled/api_keys key/name 列表）"
    - "src/z_llm_safety_gateway/middleware/auth.py 已实现 AuthMiddleware（BaseHTTPMiddleware）"
    - "app factory 已按 RequestID→Auth→RateLimit→RequestSize→SafetyHeaders 顺序注册中间件"

steps:
  - id: CP-1
    description: "验证合法 Bearer token 被放行（SC-AUTH-001）"
    action: "pytest tests/unit/middleware/test_auth.py::test_valid_bearer_token_allowed -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-2
    description: "验证未知 Bearer token 返回 401（SC-AUTH-002）"
    action: "pytest tests/unit/middleware/test_auth.py::test_unknown_token_rejected -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-3
    description: "验证认证默认关闭时无 Authorization 头放行（SC-AUTH-003）"
    action: "pytest tests/unit/middleware/test_auth.py::test_disabled_auth_passes -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-4
    description: "验证显式启用后无凭据请求返回 401（fail-closed，SC-AUTH-004）"
    action: "pytest tests/unit/middleware/test_auth.py::test_enabled_fail_closed -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-5
    description: "验证 401 响应体为 OpenAI 兼容格式且不泄露 api_key（SC-AUTH-005）"
    action: "pytest tests/unit/middleware/test_auth.py::test_401_openai_compatible_body -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-6
    description: "验证放行时注入 request.state.api_key_name（SC-AUTH-006）"
    action: "pytest tests/unit/middleware/test_auth.py::test_api_key_name_injected -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-7
    description: "验证中间件顺序：RequestID 之后、路由之前（SC-AUTH-007）"
    action: "pytest tests/unit/middleware/test_auth.py::test_middleware_order -v"
    assertions:
      - type: exit_code
        expected: 0
      - type: stdout_contains
        expected: "PASSED"

  - id: CP-8
    description: "运行 ruff lint 检查认证模块"
    action: "ruff check src/z_llm_safety_gateway/middleware/auth.py tests/unit/middleware/test_auth.py"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-9
    description: "运行 mypy 类型检查认证模块"
    action: "mypy src/z_llm_safety_gateway/middleware/auth.py"
    assertions:
      - type: exit_code
        expected: 0

rollback:
  steps:
    - "删除 src/z_llm_safety_gateway/middleware/auth.py"
    - "删除 tests/unit/middleware/test_auth.py"
    - "从 app factory 中移除 AuthMiddleware 注册"
    - "恢复 config/models.py 中 AuthConfig 相关改动（如必要）"
