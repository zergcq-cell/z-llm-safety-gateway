meta:
  task_id: release-hardening
  change_id: 2026-08-23-v0.2.1-release-version-hotfix
  task_type: code
  system: Gateway/SDK release validation, artifacts and GitHub Release workflow
  preconditions:
    - Gateway source version target is 0.2.1 and SDK target remains 0.1.1
    - v0.2.0 remote tag object baseline is recorded and immutable
steps:
  - id: CP-REL-008
    description: Independent Gateway and SDK versions are accepted
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_verifier_accepts_independent_gateway_and_sdk_versions -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-009
    description: Gateway tag and runtime mismatches are rejected
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_verifier_rejects_gateway_version_mismatch -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-010
    description: SDK package/runtime mismatch is rejected
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_verifier_rejects_sdk_internal_mismatch -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-011
    description: Missing or empty notes fail, while adjacent release bodies remain excluded
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_verifier_requires_exact_non_empty_notes tests/unit/release/test_release_contract.py::test_release_notes_extraction_stops_at_adjacent_version -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-012
    description: Four distributions carry Gateway 0.2.1 and SDK 0.1.1 metadata
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_build_produces_four_valid_distribution_artifacts -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-013
    description: SDK isolation and dependency-reuse wheel smoke cover all three CLI entry points
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_sdk_independent_install tests/unit/release/test_release_contract.py::test_combined_wheels_install_and_run_all_cli_entry_points tests/unit/release/test_release_contract.py::test_release_workflow_has_safe_dry_run_and_tag_only_publish -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-014
    description: Workflow dry-run and tag-only publication gates remain strict
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_workflow_has_safe_dry_run_and_tag_only_publish -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-015
    description: Main commit passes the complete Python 3.10/3.11/3.12 matrix before tag creation
    action: gh run list --commit "$(git rev-parse HEAD)" --workflow CI --json status,conclusion,headSha
    assertions:
      - type: stdout_contains
        expected: success
  - id: CP-REL-016
    description: v0.2.1 Release has exact notes/assets and its peeled tag equals the verified HEAD
    action: >-
      release_json="$(mktemp)" &&
      gh release view v0.2.1 --repo zergcq-cell/z-llm-safety-gateway
      --json tagName,targetCommitish,assets,body,url > "$release_json" &&
      .venv/bin/python tools/release_checks.py github-release
      --version v0.2.1 --input "$release_json" &&
      test "$(git ls-remote origin refs/tags/v0.2.1^{} | cut -f1)" = "$(git rev-parse HEAD)"
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-017
    description: Public v0.2.0 tag remains immutable and has no bypass Release
    action: >-
      gh api --include repos/zergcq-cell/z-llm-safety-gateway/releases/tags/v0.2.0
      2>&1 | grep -Eq '^HTTP/[0-9.]+ 404' &&
      git ls-remote origin refs/tags/v0.2.0 refs/tags/v0.2.0^{}
    assertions:
      - type: stdout_contains
        expected: dae034025cc7f68d13ef7b9b3ba3f1b1eca35411
      - type: stdout_contains
        expected: d67d573b0e38691707e70e64a7ec1a431ca1f545
rollback:
  steps:
    - Do not move or delete any published tag; stop before tag creation when a local or main CI gate fails
    - If v0.2.1 tag publication fails after push, preserve the tag and repair with a new patch version
