meta:
  task_id: project-docs
  change_id: 2026-08-23-v0.2.1-release-version-hotfix
  task_type: code
  system: Gateway and SDK release documentation surfaces
  preconditions:
    - Gateway target is 0.2.1 and SDK target is 0.1.1
steps:
  - id: CP-DOCS-008
    description: Gateway public surfaces consistently declare v0.2.1
    action: .venv/bin/pytest tests/unit/release/test_documentation_contract.py::test_release_version_and_python_support_are_consistent -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-DOCS-009
    description: SDK and dual-version plugin surfaces consistently retain v0.1.1
    action: .venv/bin/pytest tests/unit/release/test_documentation_contract.py::test_plugin_docs_describe_available_release_and_tls_capabilities tests/unit/release/test_documentation_contract.py::test_example_plugins_allow_the_documented_sdk_wheel_reference tests/unit/release/test_sdk_release_contract.py -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-DOCS-010
    description: v0.2.1 release notes are non-empty and isolated from adjacent versions
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_notes_extraction_stops_at_adjacent_version tests/unit/release/test_release_contract.py::test_current_release_notes_document_hotfix_without_rewriting_history -q
    assertions:
      - type: exit_code
        expected: 0
rollback:
  steps:
    - Preserve historical CHANGELOG, archive and SDK 0.1.1 references; revert only current Gateway 0.2.1 surfaces if the release is abandoned before tag creation
