meta:
  task_id: detector-sdk
  change_id: 2026-08-23-v0.2.1-release-version-hotfix
  task_type: code
  system: Independent Detector SDK package and release surfaces
  preconditions:
    - Gateway target is 0.2.1
    - Detector SDK target remains 0.1.1
steps:
  - id: CP-SDK-010
    description: SDK package and runtime remain internally consistent at 0.1.1
    action: .venv/bin/pytest tests/unit/release/test_sdk_release_contract.py tests/unit/sdk/test_sdk_package.py -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-SDK-011
    description: SDK 0.1.1 artifacts build and install independently
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_build_produces_four_valid_distribution_artifacts tests/unit/release/test_release_contract.py::test_sdk_independent_install -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-SDK-012
    description: SDK documentation and example wheel references remain at 0.1.1
    action: .venv/bin/pytest tests/unit/release/test_documentation_contract.py::test_plugin_docs_describe_available_release_and_tls_capabilities tests/unit/release/test_documentation_contract.py::test_example_plugins_allow_the_documented_sdk_wheel_reference tests/unit/release/test_documentation_contract.py::test_sdk_release_surfaces_keep_independent_version -q
    assertions:
      - type: exit_code
        expected: 0
rollback:
  steps:
    - Preserve SDK 0.1.1 metadata and public contract; revert only uncommitted Gateway release-surface changes if validation fails
