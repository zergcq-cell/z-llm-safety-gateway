requirements:
  - id: REQ-DOCS-008
    description: 公开文档 SHALL 按 Gateway 与 SDK 角色展示 v0.2.1 / v0.1.1
    scenarios:
      - id: SC-DOCS-008
        confidence: high
        evidence: proposal.yaml C3; success_criteria 1/9
        given: Gateway README、getting-started、configuration、API、deployment、config comments 与 Compose image
        when: 扫描当前 Gateway 发布版本表面
        then: 当前 Gateway 版本 SHALL 一致为 v0.2.1 或 0.2.1
        and:
          - 历史 CHANGELOG、archive 与旧 spec SHALL 不被改写
          - Python 3.10–3.12 支持声明 SHALL 保持不变
      - id: SC-DOCS-009
        confidence: high
        evidence: proposal.yaml C3; constraints 3
        given: SDK README、plugin/grpc/commercial docs、CLI 模板和示例插件依赖
        when: 扫描 SDK 版本与安装引用
        then: 当前 Detector SDK 版本 SHALL 一致保持 v0.1.1 或 0.1.1
        and:
          - 双版本文档 SHALL 同时标明 Gateway v0.2.1 / SDK v0.1.1
          - SDK 0.1.1 GitHub wheel URL SHALL 保持有效格式
      - id: SC-DOCS-010
        confidence: high
        evidence: proposal.yaml C3/C6; success_criteria 7
        given: CHANGELOG 的 Unreleased、0.2.1、0.2.0 与 0.1.1 相邻章节
        when: 读取或提取 v0.2.1 发布说明
        then: 0.2.1 章节 SHALL 说明独立版本校验热修复和 SDK 保持 0.1.1
        and:
          - notes SHALL 不包含相邻版本正文
          - v0.2.0 失败发布事实 SHALL 可审计且不得声称已创建成功 Release
