meta:
  capability: release-hardening
  change_id: 2026-08-23-v0.2.1-release-version-hotfix
  created: '2026-08-23T22:25:00+08:00'
  confidence: high
requirements:
  - id: REQ-REL-005
    description: Gateway tag 与独立 SDK 版本 SHALL 按角色严格校验
    scenarios:
      - id: SC-REL-008
        confidence: high
        evidence: proposal.yaml C1/C2; success_criteria 1
        given: Gateway package/runtime 均为 0.2.1，SDK package/runtime 均为 0.1.1，且 CHANGELOG 有非空 0.2.1 章节
        when: 以 v0.2.1 执行发布版本校验
        then: 校验器 SHALL 接受 Gateway 0.2.1 与 SDK 0.1.1 的独立版本组合
        and:
          - 可选 v 前缀 SHALL 只在比较 Gateway tag 时规范化
          - SDK SHALL 不被要求等于 Gateway tag
      - id: SC-REL-009
        confidence: high
        evidence: proposal.yaml C2; success_criteria 2
        given: Gateway package 或 runtime 版本与 v0.2.1 tag 不一致
        when: 执行发布版本校验
        then: 校验器 SHALL 以非零状态拒绝发布
        and:
          - 错误 SHALL 明确标识 gateway version mismatch
          - SDK 与 CHANGELOG 检查 SHALL 不得掩盖 Gateway 错配
      - id: SC-REL-010
        confidence: high
        evidence: proposal.yaml C1/C2; success_criteria 2
        given: SDK package 与 SDK runtime 版本不一致
        when: 对任意合法 Gateway tag 执行发布版本校验
        then: 校验器 SHALL 以非零状态拒绝发布
        and:
          - 错误 SHALL 明确标识 SDK version mismatch
          - 校验器 SHALL 不静默选择任一 SDK 版本
      - id: SC-REL-011
        confidence: high
        evidence: proposal.yaml C2; success_criteria 2
        given: Gateway 与 SDK 版本声明有效，但 CHANGELOG 缺少或包含空的 0.2.1 章节
        when: 执行发布版本校验或提取 v0.2.1 notes
        then: 校验器 SHALL 以非零状态拒绝发布
        and:
          - 有效 notes SHALL 只包含 0.2.1 正文
          - 相邻 0.2.0 或 0.1.1 内容 SHALL 不得进入输出
  - id: REQ-REL-006
    description: v0.2.1 Release SHALL 构建并验证两个独立版本的四个产物
    scenarios:
      - id: SC-REL-012
        confidence: high
        evidence: proposal.yaml C3/C4; success_criteria 3
        given: Gateway metadata/runtime 为 0.2.1 且 SDK metadata/runtime 为 0.1.1
        when: 分别构建根项目和 sdk 项目并检查全部 distributions
        then: 构建 SHALL 恰好生成两个 wheel 与两个 sdist
        and:
          - 产物 metadata SHALL 精确包含 z-llm-safety-gateway 0.2.1
          - 产物 metadata SHALL 精确包含 z-llm-safety-gateway-sdk 0.1.1
          - 四个产物 SHALL 全部通过标准 metadata 或 Twine 检查
      - id: SC-REL-013
        confidence: high
        evidence: proposal.yaml C4; success_criteria 4
        given: 已验证的 Gateway 0.2.1 wheel 与 SDK 0.1.1 wheel，以及干净虚拟环境
        when: 安装两个 wheel 并运行三个 CLI 的 --help
        then: z-safety-gateway、zlg 与 zlg-sdk SHALL 全部退出码为 0
        and:
          - SDK wheel SHALL 另可在无 Gateway 包的环境独立安装运行
  - id: REQ-REL-007
    description: v0.2.1 SHALL 由不可变新 tag 和完整远程质量链发布
    scenarios:
      - id: SC-REL-014
        confidence: high
        evidence: proposal.yaml C5; success_criteria 5
        given: Release workflow 的 workflow_dispatch 与 tag push 两类事件
        when: 检查版本输入、job condition 和依赖图
        then: workflow_dispatch SHALL 只验证且 SHALL NOT 创建 GitHub Release
        and:
          - 手动 version 输入 SHALL required 且不得保留静态 default
          - tag push SHALL 使用 github.ref_name
          - release job SHALL 依赖 quality、build、audit
          - 任一前置 job 失败时 release job SHALL skipped
      - id: SC-REL-015
        confidence: medium
        evidence: proposal.yaml C6; success_criteria 6/7
        given: Gate 3 已批准且 v0.2.1 发布提交已在本地通过完整质量门
        when: 推送 main 并观察该 commit 的 GitHub Actions CI
        then: Python 3.10、3.11、3.12 jobs SHALL 全部成功后才允许创建 v0.2.1 tag
        and:
          - tag SHALL 指向该同一验证提交
          - CI 失败 SHALL 阻止 tag 创建或推送
      - id: SC-REL-016
        confidence: medium
        evidence: proposal.yaml C6; success_criteria 7
        given: v0.2.1 tag 已指向三版本 CI 全绿的发布提交
        when: 推送新 tag 并等待 Release workflow
        then: quality、build、audit、release jobs SHALL 全部成功并创建 v0.2.1 GitHub Release
        and:
          - Release SHALL 包含四个已验证产物
          - Release notes SHALL 只包含 CHANGELOG 0.2.1 正文
          - GitHub Release SHALL 验证 tag 已存在
      - id: SC-REL-017
        confidence: medium
        evidence: proposal.yaml constraints 2; success_criteria 8
        given: v0.2.0 tag object dae034025cc7f68d13ef7b9b3ba3f1b1eca35411 与 peeled commit d67d573b0e38691707e70e64a7ec1a431ca1f545
        when: v0.2.1 发布前后读取远程 tag refs
        then: v0.2.0 tag object 与 peeled commit SHALL 保持不变
        and:
          - 流程 SHALL NOT 删除、移动、覆盖或重新推送 v0.2.0
          - 流程 SHALL NOT 为失败 tag 手工伪造绕过门禁的 v0.2.0 Release
