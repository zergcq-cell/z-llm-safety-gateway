meta:
  capability: detector-sdk
  change_id: 2026-08-23-v0.2.1-release-version-hotfix
  created: '2026-08-23T22:25:00+08:00'
  confidence: high
requirements:
  - id: REQ-SDK-009
    description: Detector SDK SHALL 在 Gateway v0.2.1 发布中保持独立 0.1.1 契约
    scenarios:
      - id: SC-SDK-010
        confidence: high
        evidence: proposal.yaml C1/C3; constraints 3
        given: Gateway 发布版本提升到 0.2.1
        when: 检查 SDK pyproject、模块 __version__ 和发布校验
        then: SDK package 与 runtime 版本 SHALL 均保持 0.1.1
        and:
          - SDK 版本 SHALL 不因 Gateway tag 自动提升
          - SDK package/runtime 不一致 SHALL 阻断发布
      - id: SC-SDK-011
        confidence: high
        evidence: proposal.yaml C4; success_criteria 3/4
        given: 从 v0.2.1 提交构建的 SDK 0.1.1 wheel 与 sdist
        when: 验证 metadata 并在无 Gateway 包的干净环境安装 wheel
        then: 两个 SDK 产物 SHALL 声明 0.1.1 且 zlg-sdk --help SHALL 成功
        and:
          - SDK 核心导入 SHALL 不引入 Gateway runtime 依赖
      - id: SC-SDK-012
        confidence: high
        evidence: proposal.yaml C3; non_goals 2
        given: SDK README、CLI 模板、插件文档和示例插件 direct wheel references
        when: 扫描当前发布型 SDK 安装入口
        then: SDK wheel 名称与下载引用 SHALL 保持 0.1.1
        and:
          - 文档 SHALL 明确 Gateway 0.2.1 与 SDK 0.1.1 独立演进
          - 不存在的 SDK 0.2.1 wheel SHALL NOT 被宣传
