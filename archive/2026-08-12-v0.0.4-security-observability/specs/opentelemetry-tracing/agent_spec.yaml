meta:
  task_id: "opentelemetry-tracing"
  change_id: "2026-08-12-v0.4.0-security-observability"
  task_type: code
  system: "z LLM Safety Gateway"
  preconditions:
    - "Python 3.10+ 环境可用"
    - "opentelemetry-api/sdk 及 opentelemetry-instrumentation-fastapi 依赖可安装（可选，仅在启用时）"
    - "observability/tracing.py 模块存在，负责按配置初始化 TracerProvider"
    - "observability.tracing.enabled/exporter/endpoint/sample_rate 配置项已接入配置系统"

steps:
  - id: CP-1
    description: "验证 tracing.enabled=false 时不初始化 TracerProvider、不导出（SC-OTEL-001）"
    action: "运行 pytest 测试：加载 tracing.enabled=false 配置启动 app，处理一个请求，断言未初始化全局 TracerProvider 且无 span 导出"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-2
    description: "验证 tracing.enabled=true 且 exporter=otlp 时初始化并导出（SC-OTEL-002）"
    action: "运行 pytest 测试：加载 enabled=true、exporter=otlp、endpoint 指向 mock collector 的配置，断言全局 TracerProvider 已初始化且 OTLP exporter 指向该 endpoint，请求产生 span 并导出"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-3
    description: "验证 sample_rate 采样比例（SC-OTEL-003）"
    action: "运行 pytest 测试：设置 sample_rate=0.1 处理 N 个请求，断言被采样的请求比例近似 10%（或 mock Sampler 验证采样决策），未采样请求不导出"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-4
    description: "验证 span 结构、属性与嵌套（SC-OTEL-004）"
    action: "运行 pytest 测试：处理一个含检测与 provider 调用的请求，导出 span 到 InMemorySpanExporter，断言 gateway.request 为根 span 且携带 request_id/model/direction 属性，存在 detector.* 与 provider.call 子 span 并携带相应属性"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-5
    description: "验证 W3C trace context 传播与延续（SC-OTEL-005）"
    action: "运行 pytest 测试：携带 traceparent/tracestate 头请求，断言网关延续客户端 trace context 作为子 span；无头请求断言创建新根 trace"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-6
    description: "运行 opentelemetry-tracing 能力全量单元测试"
    action: "运行: pytest tests/unit/observability/ -v"
    assertions:
      - type: exit_code
        expected: 0

  - id: CP-7
    description: "运行 lint 与类型检查"
    action: "运行: ruff check src/z_llm_safety_gateway/observability/ && mypy src/z_llm_safety_gateway/observability/"
    assertions:
      - type: exit_code
        expected: 0

rollback:
  steps:
    - "回滚 src/z_llm_safety_gateway/observability/tracing.py 相关改动"
    - "移除 opentelemetry-tracing 新增的测试文件"
    - "如需移除依赖：pip uninstall opentelemetry-api opentelemetry-sdk opentelemetry-instrumentation-fastapi"
