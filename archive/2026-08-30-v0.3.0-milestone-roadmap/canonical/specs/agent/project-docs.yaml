meta:
  task_id: project-docs
  change_id: 2026-08-30-v0.3.0-milestone-roadmap
  created: '2026-08-30T16:32:52+08:00'
  task_type: documentation
  system: README, CHANGELOG, AGENTS, DESIGN roadmap, version surfaces, and documentation links
  preconditions:
    - DESIGN.md Post-v0.1.0 Roadmap is the sole authoritative version roadmap.
    - This change does not deliver multi-tenant runtime behavior.
steps:
  - id: CP-DOCS-014
    description: README points to the authoritative v0.3.0 roadmap and does not duplicate it.
    action: .venv/bin/pytest tests/unit/release/test_documentation_contract.py::test_v030_readme_summary_links_to_authoritative_roadmap -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-DOCS-015
    description: CHANGELOG and AGENTS describe planning facts without claiming runtime delivery.
    action: .venv/bin/pytest tests/unit/release/test_documentation_contract.py::test_v030_changelog_and_project_memory_are_planning_only -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-DOCS-016
    description: Gateway, SDK, configuration, public API, and runtime source surfaces remain unchanged.
    action: bash -c 'test -z "$(git status --porcelain=v1 -- src sdk config pyproject.toml docs/api-spec.md)" && .venv/bin/pytest tests/unit/release/test_documentation_contract.py::test_v030_scope_change_preserves_runtime_and_version_surfaces -q'
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-DOCS-017
    description: Active Markdown links and the complete documentation contract suite pass.
    action: .venv/bin/pytest tests/unit/release/test_documentation_contract.py -q
    assertions:
      - type: exit_code
        expected: 0
rollback:
  steps:
    - Revert only current documentation and documentation contract test changes.
    - Do not edit historical release notes, archive content, canonical history, runtime source, config, or package versions.
