meta:
  task_id: observability
  change_id: 2026-09-08-tenant-evidence-observability-isolation
  task_type: code
  system: z LLM Safety Gateway tenant observation
  preconditions:
  - Gate 2 approved before implementation.
  - Planned test nodes must be implemented in RED phase; collect-only must prove every
    node exists before Gate 3.
steps:
- id: CP-TOB-001
  description: 'TC-TOB-001 / SC-TOB-001: 日志及 Trace 投影'
  action: .venv/bin/python -m pytest tests/unit/tenancy/test_observation_tob.py::test_tc_tob_001
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TOB-001
  expected_behavior:
  - SHALL 通过统一安全投影附加 tenant.scope、tenant.id、tenant.policy_id；无值字段省略。
  - 日志采用 tenant_scope、tenant_id、tenant_policy_id 对应键；可信投影覆盖同名非可信字段。
  - Flow/Node 观测函数显式接受快照，第三方插件内部日志不承诺可强制隔离。
  implementation_status: planned
- id: CP-TOB-002
  description: 'TC-TOB-002 / SC-TOB-002: 日志及 Trace 投影'
  action: .venv/bin/python -m pytest tests/integration/test_tenant_observation_tob.py::test_tc_tob_002
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TOB-002
  expected_behavior:
  - SHALL 不将原文、密钥、原始异常、URL query 或客户端 baggage 导出为租户观测属性。
  - Trace span 名称不包含租户或客户端字段；请求/Provider model 在多租户模式投影为固定 redacted。
  - 自动 FastAPI instrumentation 的 Header 捕获必须关闭、URL query 必须脱敏；traceparent 仅用于链路连接，不用于身份。
  implementation_status: planned
- id: CP-TOB-003
  description: 'TC-TOB-003 / SC-TOB-003: 日志及 Trace 投影'
  action: .venv/bin/python -m pytest tests/integration/test_tenant_observation_tob.py::test_tc_tob_003
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TOB-003
  expected_behavior:
  - SHALL 每个请求关联事件使用其显式快照，嵌套 Flow 延续相同归属。
  - 取消、正常结束与失败之后无残留 contextvars。
  - Span exporter、日志捕获夹具验证实际输出而非只验证调用参数。
  implementation_status: planned
- id: CP-TOB-004
  description: 'TC-TOB-004 / SC-TOB-004: 观测故障策略'
  action: .venv/bin/python -m pytest tests/integration/test_tenant_observation_tob.py::test_tc_tob_004
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TOB-004
  expected_behavior:
  - SHALL 保持禁用时 no-op；启用但不可用时产生稳定 tracing_unavailable 诊断，安全结果和 Provider 语义不变。
  - 沿用已有 best-effort tracing 政策；不得每次请求重复初始化或新建 exporter。
  implementation_status: planned
- id: CP-TOB-005
  description: 'TC-TOB-005 / SC-TOB-005: 观测故障策略'
  action: .venv/bin/python -m pytest tests/unit/tenancy/test_observation_tob.py::test_tc_tob_005
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TOB-005
  expected_behavior:
  - SHALL 使用固定 unknown/invalid 值或省略非法字段，并产生 projection_sanitized 诊断。
  - 不截取、哈希或缓存任意输入来创建身份/标签；异常对象不得进入诊断文本。
  - 网关管理的日志及 Trace 失败诊断路径都经过相同安全投影。
  implementation_status: planned
rollback:
  steps:
  - 保留失败证据；回退本切片修改前先审阅 diff，禁止覆盖用户改动。
