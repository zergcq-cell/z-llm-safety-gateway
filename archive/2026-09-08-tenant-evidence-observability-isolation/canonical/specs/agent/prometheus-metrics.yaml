meta:
  task_id: prometheus-metrics
  change_id: 2026-09-08-tenant-evidence-observability-isolation
  task_type: code
  system: z LLM Safety Gateway tenant observation
  preconditions:
  - Gate 2 approved before implementation.
  - Planned test nodes must be implemented in RED phase; collect-only must prove every
    node exists before Gate 3.
steps:
- id: CP-TME-001
  description: 'TC-TME-001 / SC-TME-001: 租户指标与计数语义'
  action: .venv/bin/python -m pytest tests/unit/tenancy/test_observation_tme.py::test_tc_tme_001
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TME-001
  expected_behavior:
  - SHALL 新增 safety_tenant_decisions_total{tenant_scope,tenant_id,direction,action}
    和 safety_tenant_observability_events_total{tenant_scope,tenant_id,event}。
  - acme 使用 tenant/acme；其他可信租户使用 tenant_other/other；legacy、unattributed、policy、system
    使用相应 scope 和固定 none。
  - 不新增 policy、model、request_id、Flow/node、API key 标签；policy 生命周期不扇出为租户指标。
  implementation_status: planned
- id: CP-TME-002
  description: 'TC-TME-002 / SC-TME-002: 租户指标与计数语义'
  action: .venv/bin/python -m pytest tests/integration/test_tenant_observation_tme.py::test_tc_tme_002
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TME-002
  expected_behavior:
  - SHALL 每个实际最终方向决策计数一次；pending、窗口和持久化重试不得重复计数。
  - action 枚举 allow/block/flag/modify/error；direction 仅 input/output。
  - 未形成方向安全决策的 401/路由错误只产生诊断，不伪造 allow。
  implementation_status: planned
- id: CP-TME-003
  description: 'TC-TME-003 / SC-TME-003: 基数与安全兼容'
  action: .venv/bin/python -m pytest tests/integration/test_tenant_observation_tme.py::test_tc_tme_003
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TME-003
  expected_behavior:
  - SHALL 身份组合最多 37，决策 tuples 最多 370，诊断 tuples 最多 296。
  - event 固定八项：tenant_context_invalid、audit_sink_failed、tracing_unavailable、projection_sanitized、auth_rejected、policy_unavailable、background_failed、cancelled。
  - 每个 counter 的 total/created 样本合计最多 1332；诊断记录不递归产生诊断。
  implementation_status: planned
- id: CP-TME-004
  description: 'TC-TME-004 / SC-TME-004: 基数与安全兼容'
  action: .venv/bin/python -m pytest tests/unit/tenancy/test_observation_tme.py::test_tc_tme_004
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TME-004
  expected_behavior:
  - SHALL 保留现有 metric 名称和 label schema，model 固定 redacted；自由文本映射固定 unknown，ID 仅允许启动期受限配置集合。
  - 动作、状态、direction 使用现有有限枚举；category、reason_code、error_type、field、detector_type 采用实现中固定允许值集合加
    unknown。
  - Counter/Histogram 的 ID label 白名单取配置字典序前 256 项，其余归并 other；Gauge 仅接受完整预编译实体集合，不聚合实体，未知实体拒绝。
  - 不得将任意输入加入缓存；单租户旧指标行为保持兼容。
  implementation_status: planned
- id: CP-TME-005
  description: 'TC-TME-005 / SC-TME-005: 基数与安全兼容'
  action: .venv/bin/python -m pytest tests/integration/test_tenant_observation_tme.py::test_tc_tme_005
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TME-005
  expected_behavior:
  - SHALL 禁用时不分配 label 状态；不同 app 的租户白名单和新增 registry 不相互覆盖。
  - 使用 app-scoped observation runtime 及显式注入，不能把租户配置保存在模块级最近 app 变量。
  - 现有全局 metrics/tracing API 的兼容调用保留，但多租户请求路径必须绑定其所属 app runtime。
  implementation_status: planned
rollback:
  steps:
  - 保留失败证据；回退本切片修改前先审阅 diff，禁止覆盖用户改动。
