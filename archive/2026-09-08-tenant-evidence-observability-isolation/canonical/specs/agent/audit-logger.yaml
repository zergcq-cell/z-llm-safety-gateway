meta:
  task_id: audit-logger
  change_id: 2026-09-08-tenant-evidence-observability-isolation
  task_type: code
  system: z LLM Safety Gateway tenant observation
  preconditions:
  - Gate 2 approved before implementation.
  - Planned test nodes must be implemented in RED phase; collect-only must prove every
    node exists before Gate 3.
steps:
- id: CP-TAU-001
  description: 'TC-TAU-001 / SC-TAU-001: 租户审计证据与兼容'
  action: .venv/bin/python -m pytest tests/unit/tenancy/test_observation_tau.py::test_tc_tau_001
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TAU-001
  expected_behavior:
  - SHALL 在新增可选 tenant_context 字段中记录可信观测快照，并保留现有 Flow/节点/插件版本/有效策略证据。
  - FlowEvidence v1.0 schema 不变；归属写在 AuditEntry 外层，避免破坏 extra=forbid 消费者。
  - 旧 AuditEntry JSON 无该字段仍可读取，单租户默认序列化不增加该字段。
  implementation_status: planned
- id: CP-TAU-002
  description: 'TC-TAU-002 / SC-TAU-002: 租户审计证据与兼容'
  action: .venv/bin/python -m pytest tests/integration/test_tenant_observation_tau.py::test_tc_tau_002
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TAU-002
  expected_behavior:
  - SHALL 使用发起请求快照，保持现有 request_id、Flow execution_id 与归属关联。
  - 失败或取消诊断不得复制另一个请求的归属或原文。
  implementation_status: planned
- id: CP-TAU-003
  description: 'TC-TAU-003 / SC-TAU-003: 租户审计证据与兼容'
  action: .venv/bin/python -m pytest tests/unit/tenancy/test_observation_tau.py::test_tc_tau_003
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TAU-003
  expected_behavior:
  - SHALL 记录 scope=policy 和可信 policy_id，tenant_id=null，保持原有顶层 policy_id。
  - 不伪造请求归属，不向每个租户重复发出事件。
  implementation_status: planned
- id: CP-TAU-004
  description: 'TC-TAU-004 / SC-TAU-004: 安全投影与写入失败'
  action: .venv/bin/python -m pytest tests/unit/tenancy/test_observation_tau.py::test_tc_tau_004
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TAU-004
  expected_behavior:
  - SHALL 归属字段仅来自可信快照；新增元数据不泄露秘密，默认不记录 content。
  - store_content=true 的现有显式内容政策保留；它不授权把内容写入日志、Trace 或指标。
  - 新增归属 JSON UTF-8 增量上限 512 bytes，不复制租户配置；现有 Flow evidence size 预算仍成立。
  implementation_status: planned
- id: CP-TAU-005
  description: 'TC-TAU-005 / SC-TAU-005: 安全投影与写入失败'
  action: .venv/bin/python -m pytest tests/integration/test_tenant_observation_tau.py::test_tc_tau_005
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TAU-005
  expected_behavior:
  - SHALL 标记 entry.evidence_persisted=false，并保持原有不因审计 sink 失败改变安全结果的行为。
  - 如有 FlowEvidence，返回值和 entry 内的 evidence_persisted 一致。
  - 发出稳定 audit_sink_failed 诊断，不包含路径、原始异常或原文；诊断 sink 再失败不递归。
  implementation_status: planned
- id: CP-TAU-006
  description: 'TC-TAU-006 / SC-TAU-006: 安全投影与写入失败'
  action: .venv/bin/python -m pytest tests/unit/tenancy/test_observation_tau.py::test_tc_tau_006
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TAU-006
  expected_behavior:
  - SHALL 分别显式跳过写入，或以 unattributed 记录 tenant_context_invalid 诊断并拒绝伪造的归属。
  - 审计关闭不禁用其他已启用观测通道；非法归属不补写为已知租户。
  - 禁用设置通过启动时固定事件可见，不逐请求产生禁用日志。
  implementation_status: planned
rollback:
  steps:
  - 保留失败证据；回退本切片修改前先审阅 diff，禁止覆盖用户改动。
