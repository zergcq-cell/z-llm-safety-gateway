meta:
  task_id: config-system
  change_id: 2026-09-08-tenant-evidence-observability-isolation
  task_type: code
  system: z LLM Safety Gateway tenant observation
  preconditions:
  - Gate 2 approved before implementation.
  - Planned test nodes must be implemented in RED phase; collect-only must prove every
    node exists before Gate 3.
steps:
- id: CP-TOC-001
  description: 'TC-TOC-001 / SC-TOC-001: 配置契约与启动校验'
  action: .venv/bin/python -m pytest tests/unit/tenancy/test_observation_toc.py::test_tc_toc_001
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TOC-001
  expected_behavior:
  - SHALL 默认 []，最多 32 个唯一已声明租户 ID；tenancy 关闭时要求列表为空。
  - 新增子模型 extra=forbid，严格字符串列表，不接受重复、未知、超长或类型强制转换。
  - 不新增 metrics/audit/tracing 默认启用开关；沿用已有默认关闭设置。
  implementation_status: planned
- id: CP-TOC-002
  description: 'TC-TOC-002 / SC-TOC-002: 配置契约与启动校验'
  action: .venv/bin/python -m pytest tests/unit/tenancy/test_observation_toc.py::test_tc_toc_002
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TOC-002
  expected_behavior:
  - SHALL 非法配置以固定 tenant_observability_config_invalid 失败，不回显输入；合法配置 ID 通过 scope 区分保留字。
  - tenant/other 与 tenant_other/other 不碰撞；不存在全局禁用保护的静默回退。
  implementation_status: planned
- id: CP-TOC-003
  description: 'TC-TOC-003 / SC-TOC-003: 协议兼容与文档'
  action: .venv/bin/python -m pytest tests/integration/test_tenant_observation_toc.py::test_tc_toc_003
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TOC-003
  expected_behavior:
  - SHALL 保持旧 JSON/SSE/body/header 状态语义和 FlowEvidence v1.0；新增观测字段只进入管理员观测数据。
  - 不向 Provider Header/body/baggage 或客户端响应注入租户身份。
  - 示例包含白名单聚合、非秘密 ID、共享管理员 sinks、disabled 与写入失败策略说明。
  implementation_status: planned
- id: CP-TOC-004
  description: 'TC-TOC-004 / SC-TOC-004: 协议兼容与文档'
  action: .venv/bin/python -m pytest tests/unit/tenancy/test_observation_toc.py::test_tc_toc_004
    -q --no-cov
  assertions:
  - type: exit_code
    expected: 0
  scenario_id: SC-TOC-004
  expected_behavior:
  - SHALL 仅在 Gate 3/Deliver 后将第三项标为 delivered，第四项及公共 v0.3.0 保持未完成。
  - 本次不更改包版本、不创建发布标签，不声称实现物理租户存储或访问授权隔离。
  implementation_status: planned
rollback:
  steps:
  - 保留失败证据；回退本切片修改前先审阅 diff，禁止覆盖用户改动。
