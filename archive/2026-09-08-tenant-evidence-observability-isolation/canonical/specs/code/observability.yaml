meta:
  capability: observability
  change_id: 2026-09-08-tenant-evidence-observability-isolation
  created: '2026-09-08T08:05:31+08:00'
  confidence: medium
requirements:
- id: REQ-TOB-001
  description: 日志及 Trace 投影
  confidence: medium
  scenarios:
  - id: SC-TOB-001
    confidence: high
    evidence: canonical/proposals/2026-09-08-tenant-evidence-observability-isolation.yaml#what_changes;
      design.md
    given: 已验证租户快照与 Flow/节点证据
    when: 生成网关管理的请求、安全决策、Provider、Flow/node 日志及 span
    then: SHALL 通过统一安全投影附加 tenant.scope、tenant.id、tenant.policy_id；无值字段省略。
    and:
    - 日志采用 tenant_scope、tenant_id、tenant_policy_id 对应键；可信投影覆盖同名非可信字段。
    - Flow/Node 观测函数显式接受快照，第三方插件内部日志不承诺可强制隔离。
  - id: SC-TOB-002
    confidence: medium
    evidence: canonical/proposals/2026-09-08-tenant-evidence-observability-isolation.yaml#what_changes;
      design.md
    given: 请求 model、request_id、Header、baggage 或异常包含秘密和长字符串
    when: 网关观测事件被导出
    then: SHALL 不将原文、密钥、原始异常、URL query 或客户端 baggage 导出为租户观测属性。
    and:
    - Trace span 名称不包含租户或客户端字段；请求/Provider model 在多租户模式投影为固定 redacted。
    - 自动 FastAPI instrumentation 的 Header 捕获必须关闭、URL query 必须脱敏；traceparent 仅用于链路连接，不用于身份。
  - id: SC-TOB-003
    confidence: high
    evidence: canonical/proposals/2026-09-08-tenant-evidence-observability-isolation.yaml#what_changes;
      design.md
    given: 嵌套 Flow、流式和后台任务交错运行
    when: 导出 spans 和结构化日志
    then: SHALL 每个请求关联事件使用其显式快照，嵌套 Flow 延续相同归属。
    and:
    - 取消、正常结束与失败之后无残留 contextvars。
    - Span exporter、日志捕获夹具验证实际输出而非只验证调用参数。
- id: REQ-TOB-002
  description: 观测故障策略
  confidence: high
  scenarios:
  - id: SC-TOB-004
    confidence: high
    evidence: canonical/proposals/2026-09-08-tenant-evidence-observability-isolation.yaml#what_changes;
      design.md
    given: tracing 禁用、可选依赖缺失或 exporter 故障
    when: 初始化/导出观测
    then: SHALL 保持禁用时 no-op；启用但不可用时产生稳定 tracing_unavailable 诊断，安全结果和 Provider 语义不变。
    and:
    - 沿用已有 best-effort tracing 政策；不得每次请求重复初始化或新建 exporter。
  - id: SC-TOB-005
    confidence: high
    evidence: canonical/proposals/2026-09-08-tenant-evidence-observability-isolation.yaml#what_changes;
      design.md
    given: 观测投影内部收到非法字段或不可序列化异常对象
    when: 执行安全投影
    then: SHALL 使用固定 unknown/invalid 值或省略非法字段，并产生 projection_sanitized 诊断。
    and:
    - 不截取、哈希或缓存任意输入来创建身份/标签；异常对象不得进入诊断文本。
    - 网关管理的日志及 Trace 失败诊断路径都经过相同安全投影。
