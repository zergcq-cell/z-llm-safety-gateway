meta:
  capability: config-system
  change_id: 2026-09-08-tenant-evidence-observability-isolation
  created: '2026-09-08T08:05:31+08:00'
  confidence: medium
requirements:
- id: REQ-TOC-001
  description: 配置契约与启动校验
  confidence: medium
  scenarios:
  - id: SC-TOC-001
    confidence: medium
    evidence: canonical/proposals/2026-09-08-tenant-evidence-observability-isolation.yaml#what_changes;
      design.md
    given: 未提供新增配置或提供合法已配置租户列表
    when: 加载 observability.tenancy.metric_tenant_ids
    then: SHALL 默认 []，最多 32 个唯一已声明租户 ID；tenancy 关闭时要求列表为空。
    and:
    - 新增子模型 extra=forbid，严格字符串列表，不接受重复、未知、超长或类型强制转换。
    - 不新增 metrics/audit/tracing 默认启用开关；沿用已有默认关闭设置。
  - id: SC-TOC-002
    confidence: high
    evidence: canonical/proposals/2026-09-08-tenant-evidence-observability-isolation.yaml#what_changes;
      design.md
    given: 配置非法或 tenant 名称与系统保留字同名
    when: 执行启动校验
    then: SHALL 非法配置以固定 tenant_observability_config_invalid 失败，不回显输入；合法配置 ID 通过 scope
      区分保留字。
    and:
    - tenant/other 与 tenant_other/other 不碰撞；不存在全局禁用保护的静默回退。
- id: REQ-TOC-002
  description: 协议兼容与文档
  confidence: high
  scenarios:
  - id: SC-TOC-003
    confidence: high
    evidence: canonical/proposals/2026-09-08-tenant-evidence-observability-isolation.yaml#what_changes;
      design.md
    given: 旧单租户示例及新的多租户观测示例
    when: 加载配置并通过真实 HTTP/SSE 请求运行
    then: SHALL 保持旧 JSON/SSE/body/header 状态语义和 FlowEvidence v1.0；新增观测字段只进入管理员观测数据。
    and:
    - 不向 Provider Header/body/baggage 或客户端响应注入租户身份。
    - 示例包含白名单聚合、非秘密 ID、共享管理员 sinks、disabled 与写入失败策略说明。
  - id: SC-TOC-004
    confidence: high
    evidence: canonical/proposals/2026-09-08-tenant-evidence-observability-isolation.yaml#what_changes;
      design.md
    given: 第三项通过验证但第四项尚未交付
    when: 更新路线与交付文档
    then: SHALL 仅在 Gate 3/Deliver 后将第三项标为 delivered，第四项及公共 v0.3.0 保持未完成。
    and:
    - 本次不更改包版本、不创建发布标签，不声称实现物理租户存储或访问授权隔离。
