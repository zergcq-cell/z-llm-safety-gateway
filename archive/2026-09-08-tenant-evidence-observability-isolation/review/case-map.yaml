  given: 两个租户以屏障交错执行真实 HTTP 请求
  when: 分别走 sync-output、async-output、SSE buffer、sliding-window 和 post-audit/recall
  then: SHALL 每条证据和后台诊断保留发起请求快照；共享 policy_id 时 tenant_id 仍不同。
  and:
