# proposal.yaml - Canonical 格式（AI 起草、AI 修改、AI 消费）
# V2.9.2 引入，与 proposal.md (Human View) 并存

meta:
  change_id: "2026-08-11-v0.1.0-framework-skeleton"
  title: "v0.1.0 - Framework Skeleton"
  created: "2026-08-11T00:00:00+08:00"
  status: confirmed

why:
  problem: >
    LLM Safety Gateway 项目需要一个基础框架骨架来支撑后续所有开发阶段。
    Phase 1 建立核心 HTTP 服务器、配置系统、Provider 代理和内容提取基础设施，
    这是 Pipeline（Phase 2）、流式检测（Phase 3）、安全与可观测性（Phase 4）的前置依赖。
    没有这个骨架，后续阶段的检测器、流式处理和安全层都无处挂载。
  motivation: >
    作为全新项目，需要先搭建可运行的基础框架，实现 OpenAI 兼容的透明代理功能，
    再在此基础上逐步添加安全检测能力。Phase 1 确保"请求能正常转发"这个最小可用路径打通。

what_changes:
  - id: C1
    description: "创建 FastAPI 应用，实现 OpenAI 兼容端点 /v1/chat/completions 和 /v1/models"
    type: new
  - id: C2
    description: "实现 YAML 配置系统，使用 Pydantic v2 进行 schema 验证，支持 ${VAR_NAME} 环境变量覆盖"
    type: new
  - id: C3
    description: "实现 Provider 代理层，支持模型路由（glob 模式匹配）和请求转发，支持 openai、openai_compatible、azure_openai 三种 provider 类型"
    type: new
  - id: C4
    description: "实现内容提取器，从 OpenAI messages 数组提取文本，支持多模态内容（text parts），支持 modify writeback"
    type: new
  - id: C5
    description: "添加健康检查端点 /health（liveness）、/ready（readiness）、/metrics（占位）"
    type: new
  - id: C6
    description: "实现 Request ID 中间件：UUID v4 生成、X-Request-ID 头传播、响应头注入"
    type: new
  - id: C7
    description: "创建 Docker 设置（Dockerfile + docker-compose.yml）"
    type: new
  - id: C8
    description: "搭建项目结构（pyproject.toml、src/ 目录、tests/ 目录）"
    type: new

capabilities:
  new:
    - name: "fastapi-server"
      description: "FastAPI HTTP 服务器，监听配置的 host:port，提供 OpenAI 兼容 API 端点"
    - name: "config-system"
      description: "YAML 配置加载，Pydantic v2 schema 验证，环境变量覆盖，启动时配置校验（无效配置阻止启动）"
    - name: "provider-proxy"
      description: "透明 HTTP 代理，基于 model 字段通过 glob 路由规则将请求转发到对应 LLM provider，返回响应"
    - name: "content-extractor"
      description: "从 OpenAI messages 数组提取检测文本（role: user/system/developer），支持字符串和多模态内容，支持 modify writeback 到原始请求"
    - name: "health-endpoints"
      description: "liveness (/health)、readiness (/ready)、metrics 占位端点 (/metrics)"
    - name: "request-id"
      description: "请求 ID 生成（UUID v4）或从客户端 X-Request-ID 头传播，所有响应注入 X-Request-ID 和 X-Safety-Action: allow（Phase 1 无检测，始终为 allow）"
  modified: []

constraints:
  - "技术栈：Python 3.12+ / FastAPI / Pydantic v2 / httpx / structlog"
  - "代码规范：遵循 .stdd/standards/python.md（ruff 行宽 100、完整类型注解）"
  - "测试：pytest + pytest-asyncio，覆盖率目标 80%"
  - "类型检查：mypy 必须通过"
  - "Lint：ruff check 必须通过"
  - "Phase 1 不包含检测器 Pipeline（Phase 2）"
  - "Phase 1 不包含 SSE 流式代理（Phase 3）"
  - "Phase 1 不包含认证、限流、TLS（Phase 4）"
  - "/v1/chat/completions 在 Phase 1 直接转发请求到 provider（无安全检测），所有响应附带 X-Safety-Action: allow"
  - "内容提取器作为独立模块实现和测试，Phase 2 时接入 Pipeline"

stakeholders:
  - "项目开发者（主要开发者和测试者）"
  - "未来用户（使用 Gateway 的应用程序开发者）"

risk_areas:
  - capability: "provider-proxy"
    risk: "请求转发不正确会破坏 OpenAI API 兼容性，影响所有后续请求"
    mitigation: "完整的端到端测试，使用 mock provider 验证请求转发和响应返回"
  - capability: "config-system"
    risk: "验证规则错误会阻止合法配置或放行非法配置"
    mitigation: "针对每条验证规则编写单元测试，覆盖合法和非法配置场景"
  - capability: "content-extractor"
    risk: "文本提取不正确会影响后续检测准确性"
    mitigation: "覆盖各种消息格式（字符串、多模态、不同角色）的单元测试"

non_goals:
  - "检测器 Pipeline 引擎和检测器实现（Phase 2）"
  - "SSE 流式代理和滑动窗口检测（Phase 3）"
  - "API Key 认证、限流、TLS 终止（Phase 4）"
  - "Prometheus 指标采集实现（Phase 4，Phase 1 仅占位端点）"
  - "审计日志（Phase 3）"
  - "Provider failover（v1.1+）"
  - "gRPC sidecar 插件系统（Phase 5）"
  - "输出检测（Phase 2/3）"

critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false

anchoring:
  level: L1
  reference_changes: []
  anchor_implementations: []

success_criteria:
  - "FastAPI 服务器启动并监听配置的 host:port"
  - "/v1/chat/completions 接受请求并透明转发到配置的 provider，返回 provider 响应"
  - "/v1/models 透传 provider 的模型列表"
  - "/health 返回 200 和 {\"status\": \"healthy\"}"
  - "/ready 返回 200 和 {\"status\": \"ready\"}（服务器就绪时）"
  - "/metrics 端点存在并返回 200（占位响应）"
  - "YAML 配置通过 Pydantic v2 验证加载"
  - "环境变量覆盖工作（如 ${OPENAI_API_KEY} 被实际值替换）"
  - "无效配置产生清晰错误消息并阻止启动"
  - "配置验证规则生效（如 block_threshold > flag_threshold、routing 冲突告警）"
  - "内容提取器正确提取 user/system/developer 角色消息文本"
  - "内容提取器正确处理字符串内容"
  - "内容提取器正确处理多模态内容（提取 text parts，跳过 image_url）"
  - "内容提取器正确执行 modify writeback（替换消息内容，保留 image parts）"
  - "未提供 X-Request-ID 时自动生成 UUID v4"
  - "提供 X-Request-ID 时传播客户端值"
  - "所有响应包含 X-Request-ID 头"
  - "所有响应包含 X-Safety-Action: allow 头"
  - "Provider 代理基于 model 字段通过 glob 路由规则匹配正确 provider"
  - "Provider 错误包装为 OpenAI 兼容错误格式（HTTP 502 provider_error）"
  - "Docker 容器构建并运行成功"
  - "所有 pytest 测试通过"
  - "ruff check src/ tests/ 无错误"
  - "mypy src/ 无错误"
