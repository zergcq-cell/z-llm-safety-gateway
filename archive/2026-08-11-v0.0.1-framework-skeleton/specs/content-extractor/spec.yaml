meta:
  capability: "content-extractor"
  change_id: "2026-08-11-v0.1.0-framework-skeleton"
  created: "2026-08-11T00:00:00+08:00"
  confidence: high

requirements:
  - id: REQ-001
    description: "Extract text from messages with role user, system, developer"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "proposal.yaml -> capabilities.new[3], DESIGN.md Section 3.4.1"
        given: "a messages array containing messages with roles 'user', 'system', and 'developer', each with string content"
        when: "extract_content is called on the messages array"
        then: "the function SHALL return an ExtractedContent object for each user, system, and developer message"
        and: []

  - id: REQ-002
    description: "Skip messages with role assistant, function, tool"
    scenarios:
      - id: SC-002
        confidence: high
        evidence: "DESIGN.md Section 3.4.1"
        given: "a messages array containing messages with roles 'assistant', 'function', and 'tool'"
        when: "extract_content is called on the messages array"
        then: "the function SHALL NOT return any ExtractedContent objects for assistant, function, or tool messages"
        and: []

  - id: REQ-003
    description: "Handle string content directly"
    scenarios:
      - id: SC-003
        confidence: high
        evidence: "DESIGN.md Section 3.4.1"
        given: "a message with role 'user' and content as a string 'Hello world'"
        when: "extract_content is called on the messages array"
        then: "the function SHALL return an ExtractedContent with text equal to 'Hello world'"
        and: []

  - id: REQ-004
    description: "Handle multimodal content - extract text parts (type: 'text'), skip image_url parts"
    scenarios:
      - id: SC-004
        confidence: high
        evidence: "DESIGN.md Section 3.4.1"
        given: "a message with role 'user' and content as a list containing [{'type': 'text', 'text': 'Describe this'}, {'type': 'image_url', 'image_url': {'url': '...'}}]"
        when: "extract_content is called on the messages array"
        then: "the function SHALL return an ExtractedContent with text from the text part only"
        and:
          - "image_url parts SHALL be skipped"
          - "the extracted text SHALL be 'Describe this'"

  - id: REQ-005
    description: "For multimodal, join text parts with newline"
    scenarios:
      - id: SC-005
        confidence: high
        evidence: "DESIGN.md Section 3.4.1"
        given: "a message with role 'user' and content as a list containing [{'type': 'text', 'text': 'Line 1'}, {'type': 'text', 'text': 'Line 2'}]"
        when: "extract_content is called on the messages array"
        then: "the function SHALL return an ExtractedContent with text equal to 'Line 1\\nLine 2'"
        and: []

  - id: REQ-006
    description: "Each extracted message includes message_index and role in ExtractedContent"
    scenarios:
      - id: SC-006
        confidence: high
        evidence: "DESIGN.md Section 3.4.1"
        given: "a messages array with messages at indices 0 (system), 1 (user), 2 (assistant)"
        when: "extract_content is called on the messages array"
        then: "each ExtractedContent SHALL include the original message_index from the messages array (0 and 1, not 2)"
        and:
          - "each ExtractedContent SHALL include the original role of the message"
          - "message_index SHALL be the position in the original messages array, not a sequential count of extracted items"

  - id: REQ-007
    description: "apply_modifications sorts modifications by priority (lower = first) before applying"
    scenarios:
      - id: SC-007
        confidence: high
        evidence: "DESIGN.md Section 3.4.2"
        given: "a modifications list with priorities [20, 10, 100] targeting the same message"
        when: "apply_modifications is called"
        then: "the function SHALL sort modifications by priority ascending (10, 20, 100) before applying"
        and:
          - "priority 10 SHALL be applied first"
          - "priority 100 SHALL be applied last"

  - id: REQ-008
    description: "For string content, modification replaces the content directly"
    scenarios:
      - id: SC-008
        confidence: high
        evidence: "DESIGN.md Section 3.4.2"
        given: "a request with messages[0].content as string 'original text' and a modification with message_index 0 and modified_content 'redacted text'"
        when: "apply_modifications is called"
        then: "the function SHALL replace messages[0].content with 'redacted text'"
        and: []

  - id: REQ-009
    description: "For multimodal content, modification writes to FIRST text part, clears remaining text parts, preserves image parts"
    scenarios:
      - id: SC-009
        confidence: high
        evidence: "DESIGN.md Section 3.4.2"
        given: "a request with messages[0].content as a list with [{'type': 'text', 'text': 'A'}, {'type': 'image_url', 'image_url': {'url': '...'}}, {'type': 'text', 'text': 'B'}] and a modification with message_index 0 and modified_content 'modified'"
        when: "apply_modifications is called"
        then: "the function SHALL write 'modified' to the first text part (at list index 0)"
        and:
          - "the second text part (at list index 2) SHALL be cleared (set to empty string)"
          - "image_url parts SHALL be preserved unchanged"
          - "the overall list structure SHALL remain intact"

  - id: REQ-010
    description: "Empty modifications list returns request unchanged"
    scenarios:
      - id: SC-010
        confidence: high
        evidence: "DESIGN.md Section 3.4.2"
        given: "a request with a messages array and an empty modifications list"
        when: "apply_modifications is called with the empty list"
        then: "the function SHALL return the request unchanged"
        and: []

  - id: REQ-011
    description: "ExtractedContent model has fields: message_index (int), role (str), text (str)"
    scenarios:
      - id: SC-011
        confidence: high
        evidence: "DESIGN.md Section 3.4.1, design.md Decision 5"
        given: "the ExtractedContent Pydantic model is defined"
        when: "an ExtractedContent instance is created"
        then: "the model SHALL have field 'message_index' of type int"
        and:
          - "the model SHALL have field 'role' of type str"
          - "the model SHALL have field 'text' of type str"

  - id: REQ-012
    description: "Modification model has fields: detector_name (str), modified_content (str), priority (int), message_index (int)"
    scenarios:
      - id: SC-012
        confidence: high
        evidence: "DESIGN.md Section 3.4.2, design.md Decision 5"
        given: "the Modification Pydantic model is defined"
        when: "a Modification instance is created"
        then: "the model SHALL have field 'detector_name' of type str"
        and:
          - "the model SHALL have field 'modified_content' of type str"
          - "the model SHALL have field 'priority' of type int"
          - "the model SHALL have field 'message_index' of type int"
