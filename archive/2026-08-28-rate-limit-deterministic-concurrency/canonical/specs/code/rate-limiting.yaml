meta:
  capability: rate-limiting
  change_id: 2026-08-28-rate-limit-deterministic-concurrency
  created: '2026-08-28T19:00:51+08:00'
  confidence: high
requirements:
  - id: REQ-RL-006
    description: TokenBucket SHALL 支持确定性的单调时间边界，同时保持生产默认时钟兼容
    scenarios:
      - id: SC-RL-007
        confidence: high
        evidence: proposal.yaml C1/C2; success_criteria 1/3
        given: TokenBucket 使用冻结的可控单调时钟、burst=5，且 50 个协程共享该桶
        when: 50 个协程并发调用 consume
        then: TokenBucket SHALL 恰好允许初始 burst 对应的 5 次消费
        and:
          - token 数 SHALL 始终不小于 0
          - 测试 SHALL NOT 依赖 wall clock、主机速度或事件循环调度速度
      - id: SC-RL-008
        confidence: high
        evidence: proposal.yaml C2; success_criteria 2
        given: TokenBucket 使用可控单调时钟，当前 token 已耗尽且 rate 已知
        when: 时钟显式前进给定 elapsed 后触发补充
        then: TokenBucket SHALL 精确补充 rate × elapsed 个 token
        and:
          - 未显式推进时钟时 SHALL NOT 产生额外 token
      - id: SC-RL-009
        confidence: high
        evidence: proposal.yaml C2; success_criteria 2
        given: TokenBucket 使用可控单调时钟且经过时间足以补充超过 burst 的 token
        when: 时钟显式前进后触发补充
        then: TokenBucket 的可用 token SHALL 被限制为 burst 容量
      - id: SC-RL-010
        confidence: high
        evidence: proposal.yaml constraints 1; success_criteria 6
        given: 现有调用方仅以 rate 和 burst 构造 TokenBucket
        when: 未传入测试时钟并执行消费与补充
        then: TokenBucket SHALL 默认使用生产单调时钟并保持现有构造调用兼容
        and:
          - RateLimitMiddleware 的公开配置与构造路径 SHALL 保持不变
  - id: REQ-RL-007
    description: 并发消费 SHALL 由明确的事件循环序列化边界保护
    scenarios:
      - id: SC-RL-011
        confidence: high
        evidence: proposal.yaml C1; success_criteria 1
        given: TokenBucket 的消费锁已被测试持有且桶内有 token
        when: 另一个任务调用 consume
        then: consume 任务 SHALL 在锁释放前保持等待
        and:
          - 锁释放前 token 数 SHALL 保持不变
          - 锁释放后消费 SHALL 原子完成且 token 不为负
  - id: REQ-RL-008
    description: 确定性限流回归 SHALL 在全部受支持 Python 版本上提供稳定证据
    scenarios:
      - id: SC-RL-012
        confidence: high
        evidence: proposal.yaml C3; success_criteria 4/5
        given: Python 3.10、3.11、3.12 的项目隔离环境与同一变更提交
        when: 重复执行 rate-limit 定向回归及完整 pytest、Ruff、Mypy 和覆盖率门
        then: 三个 Python 版本的相关回归 SHALL 稳定通过且 TC-RL-005 不再出现时序失败
        and:
          - 缺失或失效的版本环境 SHALL 被显式报告而不得计为通过
          - 完整质量门 SHALL 保持项目既有通过标准
