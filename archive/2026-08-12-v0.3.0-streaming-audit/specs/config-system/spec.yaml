meta:
  capability: "config-system"
  change_id: "2026-08-12-v0.3.0-streaming-audit"
  created: "2026-08-12T10:00:00+08:00"
  confidence: high

requirements:
  - id: REQ-001
    description: "PipelineConfig gains a streaming config block with mode/window_size/overlap/send_flag_events/max_response_size/on_max_size/post_audit/recall"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "proposal.yaml -> what_changes C14; design.md -> Decision 10; DESIGN.md -> Section 8.2 and 10.2"
        given: "a YAML config file with pipeline.streaming containing mode: sliding_window, window_size: 200, overlap: 50, send_flag_events: false, max_response_size: 1MB, on_max_size: block, post_audit: true, recall.method: sse"
        when: "the config is validated through the GatewayConfig Pydantic v2 model"
        then: "the model SHALL parse pipeline.streaming into a StreamingConfig instance with all fields"
        and:
          - "streaming.mode SHALL default to 'sliding_window' when not specified"
          - "streaming.mode SHALL accept 'sliding_window' or 'buffer' as valid values"
          - "window_size SHALL default to 200 and overlap to 50 when not specified"
          - "max_response_size SHALL accept duration/size strings like '1MB'"
          - "on_max_size SHALL accept 'block' or 'truncate' as valid values"
          - "post_audit SHALL default to true when not specified"
          - "recall.method SHALL accept 'sse', 'webhook', or 'both' as valid values"
          - "when not specified, pipeline.streaming SHALL default to a valid StreamingConfig with all defaults"

      - id: SC-002
        confidence: high
        evidence: "design.md -> Decision 10; DESIGN.md -> Section 8.2"
        given: "a PipelineConfig with streaming.mode set to an invalid value 'tokenizer'"
        when: "the config is validated through the Pydantic v2 model"
        then: "the model SHALL raise a validation error indicating that streaming.mode must be 'sliding_window' or 'buffer'"
        and:
          - "the error SHALL prevent the gateway from starting"

      - id: SC-003
        confidence: medium
        evidence: "design.md -> Decision 10; DESIGN.md -> Section 8.5"
        given: "a PipelineConfig with streaming.on_max_size set to an invalid value 'stop'"
        when: "the config is validated through the Pydantic v2 model"
        then: "the model SHALL raise a validation error indicating that on_max_size must be 'block' or 'truncate'"
        and:
          - "the error SHALL prevent the gateway from starting"

  - id: REQ-002
    description: "PipelineConfig gains output_detection config block for async/sync mode with recall webhook settings"
    scenarios:
      - id: SC-004
        confidence: high
        evidence: "proposal.yaml -> what_changes C14; design.md -> Decision 8; DESIGN.md -> Section 3.5"
        given: "a YAML config file with pipeline.output_detection containing mode: async, sync_timeout: 5s, recall.webhook_url and recall.webhook_auth_header"
        when: "the config is validated through the GatewayConfig Pydantic v2 model"
        then: "the model SHALL parse pipeline.output_detection into an OutputDetectionConfig instance"
        and:
          - "output_detection.mode SHALL default to 'sync' when not specified"
          - "output_detection.mode SHALL accept 'sync' or 'async' as valid values"
          - "sync_timeout SHALL be accepted as a duration string"
          - "recall.webhook_url SHALL be a string that may be empty"
          - "recall.webhook_auth_header SHALL be an optional string that may be empty"

      - id: SC-005
        confidence: high
        evidence: "DESIGN.md -> Section 3.5; design.md -> Decision 8"
        given: "an OutputDetectionConfig with mode set to 'async'"
        when: "the config is validated"
        then: "the model SHALL accept the configuration only if recall.webhook_url is non-empty for async mode"
        and:
          - "if mode is async and webhook_url is empty, a validation error SHALL be raised"
          - "if mode is sync, webhook_url MAY be empty"
          - "the error SHALL prevent the gateway from starting when async mode lacks webhook_url"

      - id: SC-006
        confidence: high
        evidence: "DESIGN.md -> Section 3.5; design.md -> Decision 8"
        given: "a PipelineConfig with output_detection.mode set to an invalid value 'offline'"
        when: "the config is validated through the Pydantic v2 model"
        then: "the model SHALL raise a validation error indicating that output_detection.mode must be 'sync' or 'async'"
        and:
          - "the error SHALL prevent the gateway from starting"

  - id: REQ-003
    description: "AuditConfig extended with store_content, file (enabled/path/rotation/retention_days), and stdout fields"
    scenarios:
      - id: SC-007
        confidence: high
        evidence: "proposal.yaml -> what_changes C15; design.md -> Decision 9; DESIGN.md -> Section 12.2 and 12.3"
        given: "a YAML config file with audit containing enabled: true, store_content: false, sanitize_logs: true, file.enabled: true, file.path: /var/log/safety-gateway, file.rotation: daily, file.retention_days: 90, stdout: true"
        when: "the config is validated through the GatewayConfig Pydantic v2 model"
        then: "the model SHALL parse the audit section into an extended AuditConfig instance"
        and:
          - "store_content SHALL default to false when not specified"
          - "audit.file SHALL be an optional FileConfig with enabled/path/rotation/retention_days fields"
          - "audit.file.rotation SHALL default to 'daily' when not specified"
          - "audit.file.retention_days SHALL default to 90 when not specified"
          - "audit.stdout SHALL default to true when not specified"
          - "the existing audit.enabled and audit.sanitize_logs fields SHALL remain valid"

      - id: SC-008
        confidence: medium
        evidence: "design.md -> Decision 9; DESIGN.md -> Section 12.3"
        given: "an AuditConfig with file.rotation set to an invalid value 'hourly'"
        when: "the config is validated"
        then: "the model SHALL accept the value as a string (rotation format is validated by the logging handler)"
        and:
          - "no startup error SHALL be raised for rotation value"

  - id: REQ-004
    description: "New LoggingConfig added with level and format fields"
    scenarios:
      - id: SC-009
        confidence: high
        evidence: "proposal.yaml -> what_changes C15; design.md -> Decision 9; DESIGN.md -> Section 10.2 (logging section)"
        given: "a YAML config file with a logging section containing level: INFO and format: json"
        when: "the config is validated through the GatewayConfig Pydantic v2 model"
        then: "the model SHALL parse the logging section into a LoggingConfig instance"
        and:
          - "logging.level SHALL default to 'INFO' when not specified"
          - "logging.level SHALL accept DEBUG/INFO/WARNING/ERROR"
          - "logging.format SHALL default to 'json' when not specified"
          - "logging.format SHALL accept 'json' or 'text' as valid values"
          - "when the logging section is absent, the config SHALL use default LoggingConfig"

  - id: REQ-005
    description: "All new v0.3.0 config fields have defaults preserving v0.2.0 backward compatibility"
    scenarios:
      - id: SC-010
        confidence: high
        evidence: "proposal.yaml -> risk_areas (config-system); design.md -> Decision 10"
        given: "a v0.2.0-style YAML config file with pipeline (no streaming/output_detection blocks), audit.enabled/sanitize_logs only, and no logging section"
        when: "the config is loaded and validated through the GatewayConfig Pydantic v2 model"
        then: "the model SHALL accept the configuration without error"
        and:
          - "pipeline.streaming SHALL default to a valid StreamingConfig"
          - "pipeline.output_detection SHALL default to a valid OutputDetectionConfig with mode sync"
          - "audit.file and audit.stdout SHALL use defaults"
          - "logging SHALL use default LoggingConfig"
          - "no deprecation warning SHALL be emitted for the old config"
