# spec.yaml — 行为规格（Canonical YAML，AI 主读文档）
# Capability: grpc-sidecar

meta:
  capability: grpc-sidecar
  change_id: "2026-08-14-v0.5.0-plugin-ecosystem"
  created: "2026-08-14T10:30:00+08:00"
  confidence: high

requirements:
  - id: REQ-GRPC-001
    description: "GRPCDetector 实现 Detector 接口，initialize 执行 HealthCheck + Initialize 并读取 DetectorInfo"
    scenarios:
      - id: SC-GRPC-001
        confidence: high
        evidence: "proposal C2; DESIGN 7.3.1/7.3.3"
        given: "type=grpc 检测器已配置 endpoint，sidecar 服务健康且就绪"
        when: "GRPCDetector.initialize(config) 被调用"
        then: "GRPCDetector SHALL 先调用 HealthCheck，确认 status='serving' 后调用 Initialize"
        and:
          - "Initialize SHALL 携带 detector_name 与配置透传字段（除 endpoint/tls_enabled/tls_ca_file）"
          - "Initialize 成功返回后 SHALL 从 DetectorInfo 读取 name/category/description/version 并更新实例属性"
          - "HealthCheck 返回非 serving 或 Initialize 失败 SHALL 抛出异常（初始化失败）"
  - id: REQ-GRPC-002
    description: "detect 将 DetectionContext 映射为 DetectRequest，DetectResponse 映射为 DetectionResult"
    scenarios:
      - id: SC-GRPC-002
        confidence: high
        evidence: "proposal C2; DESIGN 7.3.1 DetectRequest/DetectResponse"
        given: "GRPCDetector 已初始化，内容 'content-x' 与上下文（direction=input, request_id=req-1, user_id=u1, language=en, message_index=0, metadata={k:v}）"
        when: "detect(content, context) 被调用"
        then: "GRPCDetector SHALL 构造 DetectRequest（content/direction/request_id/user_id/language/message_index/metadata）并调用 Detect"
        and:
          - "DetectResponse SHALL 映射为 DetectionResult（detector_name/category/action/confidence/risk_level/message）"
          - "action='modify' 时 SHALL 透传 modified_content"
          - "details (google.protobuf.Struct) SHALL 转换为 dict 写入 DetectionResult.details"
  - id: REQ-GRPC-003
    description: "shutdown 调用 Shutdown 并关闭通道；health_check 返回 serving 状态"
    scenarios:
      - id: SC-GRPC-003
        confidence: high
        evidence: "proposal C2; DESIGN 7.3.3 Lifecycle"
        given: "GRPCDetector 已初始化并完成若干次检测"
        when: "shutdown() 与 health_check() 被调用"
        then: "shutdown() SHALL 调用远端 Shutdown 并关闭 gRPC 通道"
        and:
          - "health_check() SHALL 调用 HealthCheck 并返回 status=='serving' 时 True，否则 False"
          - "gRPC 调用异常 SHALL 不抛出未捕获异常（shutdown 容错）"
  - id: REQ-GRPC-004
    description: "gRPC 调用超时处理：复用 per-detector timeout 或全局 detector timeout"
    scenarios:
      - id: SC-GRPC-004
        confidence: high
        evidence: "proposal C2; DESIGN 7.3.4"
        given: "per-detector timeout='3s'（或未配置时全局 security.timeout.detector='5s'），sidecar 响应超时"
        when: "Detect 调用超过配置超时"
        then: "GRPCDetector SHALL 在超时后中止调用并抛出超时异常"
        and:
          - "超时异常 SHALL 携带检测器名与超时时长，供 on_error 策略处理"
  - id: REQ-GRPC-005
    description: "TLS 支持：tls_enabled=true 时 secure_channel，tls_ca_file 加载 CA"
    scenarios:
      - id: SC-GRPC-005
        confidence: high
        evidence: "proposal C2; DESIGN 7.3.2"
        given: "config 含 tls_enabled=true 且 tls_ca_file 指向有效 CA 文件"
        when: "GRPCDetector 建立 gRPC 通道"
        then: "GRPCDetector SHALL 使用 grpc.secure_channel 并加载 CA 证书构建凭证"
        and:
          - "tls_ca_file 未配置时 SHALL 使用系统默认根证书（无自定义 CA）"
          - "tls_enabled=false（默认）时 SHALL 使用 insecure_channel"
  - id: REQ-GRPC-006
    description: "grpcio 未安装时导入/使用报清晰错误"
    scenarios:
      - id: SC-GRPC-006
        confidence: high
        evidence: "design Decision 3"
        given: "环境未安装 grpcio（未 pip install ...[grpc]）"
        when: "实例化 GRPCDetector 或导入 grpc 插件模块"
        then: "SHALL 抛出带指引的错误：安装 grpcio 或 pip install z-llm-safety-gateway[grpc]"
