meta:
  task_id: project-docs
  change_id: 2026-08-25-v0.2.2-release-reproducibility
  task_type: code
  system: Gateway/SDK current-version surfaces, release history and roadmap documentation
  preconditions:
    - Gateway target is 0.2.2 and SDK remains independently versioned at 0.1.1
steps:
  - id: CP-DOCS-011
    description: Gateway 0.2.2 and SDK 0.1.1 surfaces and compatibility matrix are exact
    action: .venv/bin/pytest tests/unit/release/test_documentation_contract.py::test_release_version_and_python_support_are_consistent tests/unit/release/test_documentation_contract.py::test_sdk_release_surfaces_keep_independent_version tests/unit/release/test_documentation_contract.py::test_plugin_docs_describe_available_release_and_tls_capabilities tests/unit/release/test_documentation_contract.py::test_example_plugins_allow_the_documented_sdk_wheel_reference -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-DOCS-012
    description: DESIGN and README roadmap match the actual v0.2.x history
    action: .venv/bin/pytest tests/unit/release/test_documentation_contract.py::test_design_roadmap_matches_release_history -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-DOCS-013
    description: v0.2.2 notes are exact, isolated and preserve v0.2.0/v0.2.1 history
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_current_release_notes_document_reproducibility_without_runtime_changes tests/unit/release/test_release_contract.py::test_release_notes_extraction_stops_at_adjacent_version -q
    assertions:
      - type: exit_code
        expected: 0
rollback:
  steps:
    - Preserve historical CHANGELOG and archive files; revert only current Gateway 0.2.2 surfaces if the release is abandoned before tag creation
    - Keep SDK 0.1.1 references and all runtime API documentation unchanged
