meta:
  task_id: github-setup
  change_id: 2026-08-25-v0.2.2-release-reproducibility
  task_type: code
  system: GitHub Actions Node 24 pins, event graph and least-privilege permissions
  preconditions:
    - Official Action releases, tag refs and action.yml node24 declarations are recorded in design.md
steps:
  - id: CP-GH-008
    description: Every external Action is an approved Node 24 full-SHA pin
    action: .venv/bin/pytest tests/unit/release/test_ci_contract.py::test_actions_are_node24_approved_sha_pins -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-GH-009
    description: Dependabot coverage and pinned dependency maintenance remain explicit
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_dependabot_covers_pinned_release_dependencies -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-GH-010
    description: Matrix, reusable quality, needs and least permissions remain strict
    action: .venv/bin/pytest tests/unit/release/test_ci_contract.py::test_ci_covers_all_supported_python_versions tests/unit/release/test_ci_contract.py::test_release_workflow_uses_least_privilege_and_complete_needs -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-GH-011
    description: Same-SHA CI, dry-run and tag runs have no Node.js 20 annotation
    action: bash tools/verify_remote_release.sh annotations zergcq-cell/z-llm-safety-gateway "$(git rev-parse HEAD)"
    assertions:
      - type: exit_code
        expected: 0
rollback:
  steps:
    - Revert workflow pins before tag creation if official Actions break supported GitHub-hosted runners
    - Do not broaden workflow permissions as a fallback; diagnose the exact job and permission instead
