meta:
  task_id: release-hardening
  change_id: 2026-08-25-v0.2.2-release-reproducibility
  task_type: code
  system: Reproducible Gateway/SDK build, draft-first GitHub Release and evidence verification
  preconditions:
    - Gateway target is 0.2.2 and independent Detector SDK target remains 0.1.1
    - v0.2.0 and v0.2.1 remote tag and Release baselines are recorded before publication
steps:
  - id: CP-REL-018
    description: Release tool input and complete hash lock are exact
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_tool_lock_is_hashed_and_complete -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-019
    description: Workflow installs the lock and builds both packages without isolation
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_workflow_uses_locked_no_isolation_builds tests/unit/release/test_release_contract.py::test_build_produces_four_valid_distribution_artifacts -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-020
    description: Tag publishing is draft-first while manual dispatch remains validation-only
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_workflow_is_draft_first_and_tag_only -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-021
    description: Exact draft and public payloads require state, digests and peeled refs
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_payload_requires_exact_state_digests_and_refs -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-022
    description: Existing releases and every payload or ref mutation fail closed
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_payload_rejects_state_digest_and_ref_mutations -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-023
    description: Release evidence is deterministic, bounded and sanitized
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_release_evidence_is_deterministic_bounded_and_sanitized -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-024
    description: Remote absence parser accepts only explicit HTTP 404
    action: .venv/bin/pytest tests/unit/release/test_release_contract.py::test_remote_absence_parser_accepts_only_explicit_404 -q
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-025-PRETAG
    description: Same-SHA main CI and dry-run succeed while v0.2.2 tag and Release remain absent
    action: bash tools/verify_remote_release.sh pre-tag zergcq-cell/z-llm-safety-gateway "$(git rev-parse HEAD)"
    assertions:
      - type: exit_code
        expected: 0
  - id: CP-REL-025
    description: v0.2.2 remote quality, dry-run, draft publication, evidence and immutable historical refs all pass
    action: bash tools/verify_remote_release.sh release zergcq-cell/z-llm-safety-gateway "$(git rev-parse HEAD)"
    assertions:
      - type: exit_code
        expected: 0
rollback:
  steps:
    - Before tag creation, revert workflow/tooling changes if any local or remote quality gate fails
    - After tag creation, never move or delete the tag; retain a failed private draft for diagnosis and require explicit maintainer approval before deleting only that draft
    - If an already public v0.2.2 Release fails post-public evidence upload, preserve tag and Release and repair automation in a new patch
