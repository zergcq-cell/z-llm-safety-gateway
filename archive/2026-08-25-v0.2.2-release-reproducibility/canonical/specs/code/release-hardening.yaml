meta:
  capability: release-hardening
  change_id: 2026-08-25-v0.2.2-release-reproducibility
  created: '2026-08-25T20:51:08+08:00'
  confidence: high
requirements:
  - id: REQ-REL-008
    description: v0.2.2 发布工具链 SHALL 由仓库内带哈希锁文件确定
    scenarios:
      - id: SC-REL-018
        confidence: high
        evidence: proposal.yaml C2; design.md Decision 2
        given: release-tools input、完整 lock 和 Gateway/SDK 的 Hatchling build backend
        when: 解析直接工具 pin、传递依赖、hash 与 workflow 安装命令
        then: release toolchain SHALL 精确锁定 pip 26.2.1、build 1.5.0、twine 7.0.0、pip-audit 2.10.1 与 hatchling 1.32.0
        and:
          - lock 中每个 requirement SHALL 使用精确版本并至少包含一个 SHA-256 hash
          - build 与 audit SHALL 使用同一受控 lock
          - workflow SHALL 不再浮动安装 build、twine 或 pip-audit
          - lock regeneration SHALL 固定使用 pip-tools 7.6.1 与记录的 Python 3.12 命令
      - id: SC-REL-019
        confidence: high
        evidence: proposal.yaml C2; design.md Decision 2; success_criteria 3
        given: release tool lock 已安装且包含锁定的 Hatchling
        when: workflow 分别构建 Gateway 与 SDK distributions
        then: 两个 build 命令 SHALL 使用 --no-isolation
        and:
          - 构建 SHALL 恰好产生 Gateway 0.2.2 与 SDK 0.1.1 的两个 wheel 和两个 sdist
          - 四个产物 SHALL 通过 metadata 与 Twine 校验
          - clean GitHub runner SHALL 安装两个 wheel 并运行三个 CLI
  - id: REQ-REL-009
    description: tag Release SHALL 在私有 draft 精确验证后才公开
    scenarios:
      - id: SC-REL-020
        confidence: high
        evidence: proposal.yaml C3; design.md Decisions 3/6; success_criteria 4/5
        given: Release workflow 同时支持 workflow_dispatch 与 v* tag push
        when: 解析事件条件、job 依赖、权限和 release 命令顺序
        then: workflow_dispatch SHALL 完成验证但 SHALL NOT 创建 draft 或公开 Release
        and:
          - tag release SHALL 依赖 quality、build、audit 全部成功
          - workflow 顶层 SHALL 只有 contents read
          - 只有 tag-only release job SHALL 具有 contents write
          - draft create SHALL 位于 publish 命令之前
      - id: SC-REL-021
        confidence: high
        evidence: proposal.yaml C3/C4; design.md Decisions 3/4; success_criteria 5/6/7
        given: v0.2.2 draft Release JSON、远程 tag object 与 peeled commit
        when: 在公开前运行确定性校验器
        then: draft 创建前 SHALL 从本地 dist 四产物生成按文件名绑定的 SHA-256 清单，校验器 SHALL 要求 tag、精确 CHANGELOG body、四资产 multiset、uploaded 状态和远程 digest 与同名本地产物 SHA-256 全部匹配
        and:
          - 仅检查 digest 格式或接受同长度错误 / 互换 digest SHALL 硬失败
          - draft 阶段 SHALL 要求 isDraft=true 且 isPrerelease=false
          - peeled commit SHALL 精确等于经验证的 GITHUB_SHA
          - 重复、缺失或额外 asset SHALL 失败
          - targetCommitish SHALL NOT 代替 peeled tag 校验
      - id: SC-REL-022
        confidence: high
        evidence: proposal.yaml constraints 3/4; design.md Decisions 3/4
        given: Release 已存在、API 非 404、payload/digest/ref 错配或 publish 后状态异常之一
        when: release 状态机处理失败
        then: workflow SHALL 以非零状态显式停止且 SHALL NOT 自动删除或移动任何 tag
        and:
          - 校验失败的私有 draft SHALL 保留供诊断
          - 已有 draft 或 published Release SHALL NOT 被自动复用或覆盖
          - 错误输出 SHALL 不包含 token、完整 headers 或环境变量全集
  - id: REQ-REL-010
    description: 发布证据与远程状态 SHALL 可机器审计且数据有界
    scenarios:
      - id: SC-REL-023
        confidence: high
        evidence: proposal.yaml C5; design.md Decision 5; success_criteria 9
        given: v0.2.2 已通过公开状态复核及四资产 digest 校验
        when: 生成 release-evidence.json、Job Summary 和 workflow artifact
        then: evidence SHALL 使用稳定 schema、确定性字段顺序和按名称排序的四个 assets
        and:
          - evidence SHALL 包含版本、tag object、peeled commit、run identity、job conclusions、notes hash、asset size/digest 和 Release URL
          - evidence SHALL NOT 包含 secrets、headers、actor email、用户内容或完整环境
          - artifact retention-days SHALL 精确为 90
          - evidence artifact SHALL NOT 成为第五个 GitHub Release asset
      - id: SC-REL-024
        confidence: medium
        evidence: proposal.yaml C4; design.md Decision 4; EXP-2026-0015
        given: GitHub Release absence 查询可能返回 404、401、403、429、5xx、网络错误或无效 JSON
        when: 解析结构化 absence evidence
        then: 校验器 SHALL 仅接受明确 HTTP 404 为资源不存在
        and:
          - 其他状态或工具失败 SHALL 保留稳定诊断并阻止创建 draft
      - id: SC-REL-025
        confidence: medium
        evidence: proposal.yaml success_criteria 4/5/11/12; design.md Decision 8
        given: Gate 3 已批准且 v0.2.2 发布提交通过本地完整质量门
        when: 依次执行同 SHA main CI、workflow_dispatch dry-run、pre-tag absence checkpoint、annotated tag 与正式 Release workflow
        then: Python 3.10/3.11/3.12、quality、build、audit、draft verify、publish 和 public verify SHALL 全部成功
        and:
          - dry-run SHALL 不创建 v0.2.2 Release
          - pre-tag checkpoint SHALL 同时观察 v0.2.2 Release 明确 404 与远程 tag 不存在
          - v0.2.2 tag peeled commit SHALL 等于验证提交
          - evidence artifact SHALL 可下载且通过 schema 校验
          - v0.2.0 与 v0.2.1 tag object、peeled commit 和 Release 状态 SHALL 保持发布前基线
