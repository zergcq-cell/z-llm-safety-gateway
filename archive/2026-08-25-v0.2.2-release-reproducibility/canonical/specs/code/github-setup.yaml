meta:
  capability: github-setup
  change_id: 2026-08-25-v0.2.2-release-reproducibility
  created: '2026-08-25T20:51:08+08:00'
  confidence: high
requirements:
  - id: REQ-GH-007
    description: GitHub workflows SHALL 使用官方 Node 24 Action 的已核验完整 SHA
    scenarios:
      - id: SC-GH-008
        confidence: high
        evidence: proposal.yaml C1; design.md Decision 1; success_criteria 1/2
        given: CI 与 Release workflows 中的全部 actions/checkout、setup-python、upload-artifact 和 download-artifact 引用
        when: 解析 uses ref 并与官方 Node 24 allowlist 比较
        then: 每个 Action SHALL 使用对应已核验的 40 位 commit SHA
        and:
          - checkout SHALL 固定 3d3c42e5aac5ba805825da76410c181273ba90b1
          - setup-python SHALL 固定 5fda3b95a4ea91299a34e894583c3862153e4b97
          - upload-artifact SHALL 固定 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          - download-artifact SHALL 固定 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
          - 每个引用 SHALL 保留对应语义版本注释
      - id: SC-GH-009
        confidence: high
        evidence: proposal.yaml C1/C2; design.md Decisions 1/2
        given: Dependabot GitHub Actions 和 Python dependency update 配置
        when: 检查更新范围与 release lock 维护契约
        then: Dependabot SHALL 继续覆盖 root pip、SDK pip 和 GitHub Actions
        and:
          - Action 更新 SHALL 不得绕过完整 SHA 与 Node 24 allowlist 测试
          - release lock 变化 SHALL 要求重新生成 hashes 并审查 diff
  - id: REQ-GH-008
    description: CI 与 Release 的事件、质量矩阵和权限 SHALL 保持最小且可验证
    scenarios:
      - id: SC-GH-010
        confidence: high
        evidence: proposal.yaml constraints 2; design.md Decisions 3/6
        given: CI workflow、Release workflow 和项目支持 Python 3.10–3.12
        when: 解析 workflow_call、matrix、job needs、if 和 permissions
        then: quality matrix SHALL 精确包含 Python 3.10、3.11、3.12
        and:
          - release SHALL 复用同一 CI workflow
          - release SHALL 依赖 quality、build、audit
          - 非 release jobs SHALL NOT 获得 contents write、actions write 或 id-token write
          - workflow_dispatch SHALL NOT 具备 publish 路径
      - id: SC-GH-011
        confidence: medium
        evidence: proposal.yaml success_criteria 1/11; design.md Decisions 1/8
        given: v0.2.2 同一提交的 main CI、dry-run 和 tag Release runs
        when: 读取三个运行的 job 结论和 annotations
        then: 所有必需 jobs SHALL 成功且 SHALL NOT 产生 Node.js 20 deprecation annotation
        and:
          - download-artifact digest mismatch policy SHALL 保持默认 error
