meta:
  capability: project-docs
  change_id: 2026-08-25-v0.2.2-release-reproducibility
  created: '2026-08-25T20:51:08+08:00'
  confidence: high
requirements:
  - id: REQ-DOCS-011
    description: 当前版本表面 SHALL 明确 Gateway 0.2.2 与 SDK 0.1.1 的独立兼容关系
    scenarios:
      - id: SC-DOCS-011
        confidence: high
        evidence: proposal.yaml C6; design.md Decision 7; success_criteria 6/10
        given: Gateway metadata/runtime、README、指南、config comments、Compose、SDK README、CLI template 与插件示例
        when: 按 Gateway、SDK 和双版本表面分类扫描当前版本
        then: Gateway 当前表面 SHALL 一致为 v0.2.2 或 0.2.2，SDK 当前表面 SHALL 一致保持 v0.1.1 或 0.1.1
        and:
          - 兼容矩阵 SHALL 明确 Gateway v0.2.2 搭配 SDK v0.1.1
          - SDK wheel URL 与示例依赖 SHALL 保持已发布的 v0.1.1
          - Python 3.10–3.12 支持口径 SHALL 保持不变
  - id: REQ-DOCS-012
    description: 项目路线图 SHALL 与实际 v0.2.x 发布历史一致
    scenarios:
      - id: SC-DOCS-012
        confidence: high
        evidence: proposal.yaml C6; design.md Decision 7; success_criteria 10
        given: DESIGN versioning policy、development roadmap 与 README 当前版本说明
        when: 检查当前版本和 v0.2.x/v0.3.0 里程碑
        then: 文档 SHALL 区分 v0.2.0 tag 已发布但 Release workflow 失败、v0.2.1 Release 成功和 v0.2.2 当前源码 / release candidate
        and:
          - 文档 SHALL 不再声明 current v0.1.0
          - Deliver 成功前 SHALL NOT 把 v0.2.2 声称为已发布 Release
          - v0.3.0 SHALL 保持下一功能里程碑且具体范围由独立 STDD change 确认
          - 本 change SHALL NOT 声称已实现 K8s、Redis、新 Provider、UI、签名或 SBOM
  - id: REQ-DOCS-013
    description: v0.2.2 发布说明 SHALL 精确描述维护范围且保留历史不可变性
    scenarios:
      - id: SC-DOCS-013
        confidence: high
        evidence: proposal.yaml constraints 4/6; design.md Decision 7; success_criteria 10/12
        given: CHANGELOG 的 Unreleased、0.2.2、0.2.1 与 0.2.0 相邻章节及 archive 历史
        when: 提取 v0.2.2 Release notes 并检查历史文件
        then: notes SHALL 只描述 Node 24、锁定工具链、draft-first、确定性证据和 Gateway 0.2.2 / SDK 0.1.1
        and:
          - notes SHALL 不混入相邻版本正文
          - v0.2.0 与 v0.2.1 历史 SHALL 不被改写
          - notes SHALL 明确运行时和产品能力不变
