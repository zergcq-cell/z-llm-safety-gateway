# spec.yaml — 行为规格（Canonical YAML，AI 主读文档）
# Capability: detector-sdk

meta:
  capability: detector-sdk
  change_id: "2026-08-14-v0.5.0-plugin-ecosystem"
  created: "2026-08-14T10:30:00+08:00"
  confidence: high

requirements:
  - id: REQ-SDK-001
    description: "SDK 独立包结构：Detector 基类、DetectionContext、DetectionResult、Modification、testing、cli"
    scenarios:
      - id: SC-SDK-001
        confidence: high
        evidence: "proposal C3; DESIGN 7.4.2"
        given: "sdk/ 目录下的 z_llm_safety_gateway_sdk 包"
        when: "检查包结构"
        then: "SDK 包 SHALL 包含 base.py（Detector 抽象基类）、context.py、result.py、modification.py、testing.py、cli.py"
        and:
          - "SDK 包根 __init__.py SHALL re-export Detector/DetectionContext/DetectionResult/Modification"
          - "SDK pyproject.toml SHALL 独立版本号（1.0.0）且不依赖网关包"
  - id: REQ-SDK-002
    description: "Detector 基类接口与网关 Detector 一致（name/category/description/version/initialize/detect）"
    scenarios:
      - id: SC-SDK-002
        confidence: high
        evidence: "proposal C3; DESIGN 7.2.3"
        given: "第三方检测器继承 SDK 的 Detector 基类并实现接口"
        when: "SDK Detector 子类被网关 entry point 加载"
        then: "SDK Detector 基类 SHALL 定义与网关一致的接口（initialize(config)/detect(content, context)）"
        and:
          - "SDK DetectionResult 字段 SHALL 与网关一致（detector_name/category/action/confidence/risk_level/message/details/modified_content）"
          - "SDK DetectionContext 字段 SHALL 与网关一致（direction/request_id/user_id/metadata/language/message_index）"
  - id: REQ-SDK-003
    description: "SDK CLI：zlg-sdk new 生成可运行项目模板（python in-process / grpc）"
    scenarios:
      - id: SC-SDK-003
        confidence: high
        evidence: "proposal C3; DESIGN 7.4.3"
        given: "执行 zlg-sdk new my-detector --type python"
        when: "生成项目模板"
        then: "CLI SHALL 生成含 pyproject.toml（含 entry points 声明）、detector.py、tests/ 的可运行项目目录"
        and:
          - "--type grpc --language python 时 SHALL 生成含 gRPC 服务端模板的项目"
          - "生成的项目 SHALL 可被网关 entry point 机制发现（配置入口点）"
  - id: REQ-SDK-004
    description: "SDK CLI：zlg-sdk validate 校验检测器实现"
    scenarios:
      - id: SC-SDK-004
        confidence: high
        evidence: "proposal C3; DESIGN 7.4.3"
        given: "一个检测器项目目录（含 Detector 子类）"
        when: "执行 zlg-sdk validate ./my-detector"
        then: "CLI SHALL 校验检测器实现是否为合法 Detector 子类（接口完整）"
        and:
          - "合法实现 SHALL 退出码 0 并输出通过信息"
          - "非法实现（缺方法/属性）SHALL 退出码非 0 并输出错误详情"
  - id: REQ-SDK-005
    description: "SDK testing 工具：mock context 与断言辅助"
    scenarios:
      - id: SC-SDK-005
        confidence: high
        evidence: "proposal C3; DESIGN 7.4.1"
        given: "检测器开发者编写单元测试"
        when: "使用 SDK testing 工具"
        then: "SDK SHALL 提供 make_context（构造测试 DetectionContext）与结果断言辅助函数"
        and:
          - "make_context SHALL 提供默认值（direction=input, request_id 自动生成）"
          - "断言辅助 SHALL 支持校验 action/risk_level/confidence 范围"
  - id: REQ-SDK-006
    description: "SDK 版本兼容：网关声明兼容范围并警告不匹配"
    scenarios:
      - id: SC-SDK-006
        confidence: high
        evidence: "proposal C3; DESIGN 7.4.4"
        given: "加载的插件依赖的 SDK 版本与网关声明兼容范围（>=1.0,<2.0）不一致"
        when: "网关启动加载插件"
        then: "网关 SHALL 记录警告日志提示 SDK 版本不匹配"
