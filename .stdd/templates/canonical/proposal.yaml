# proposal.yaml — Canonical 格式（AI 起草、AI 修改、AI 消费）
# V2.7 引入，与 proposal.md (Human View) 并存

meta:
  change_id: ""                # 与 changes/<name>/ 目录名一致
  title: ""                    # 变更标题
  created: ""                  # ISO 8601 时间戳
  status: draft                # draft | confirmed | in_progress | completed

why:
  problem: ""                  # 问题陈述
  motivation: ""               # 为什么现在做

what_changes:
  - id: C1
    description: ""            # 变更描述
    type: new                  # new | modified | removed

capabilities:
  new:
    - name: ""                 # capability 名称
      description: ""          # 描述
  modified:
    - name: ""
      description: ""

constraints:
  - ""

stakeholders:
  - ""

risk_areas:
  - capability: ""             # capability 名称
    risk: ""                   # 风险描述
    mitigation: ""             # 缓解措施

non_goals:
  - ""

critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false

anchoring:
  level: L1                    # L1 | L2 | L3 | L4
  reference_changes: []        # L3 时引用
  anchor_implementations: []   # L4 时引用

# 必须逐项对照项目根目录 PRINCIPLES.md；不适用也要说明原因
principle_check:
  plugin_flow: ""             # 领域能力在插件、组合在 Flow、核心保持最小
  explicit_policy_failure: "" # 策略/默认值/失败/绕过/降级显式且可观测
  transparent_contracts: ""   # 边界语义、兼容性、延迟和资源成本
  evidence_data_protection: "" # 可解释/可审计、最小化敏感数据采集
  tradeoffs_or_departures: "" # 无则填 none；有则记录取舍及待确认事项

success_criteria:
  - ""
