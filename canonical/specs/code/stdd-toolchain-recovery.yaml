        then: "DC-HASH 与 DC-FIELD SHALL 通过"
        and: ["archive 原文件 SHALL 不被移动或重写", "项目 canonical 索引 SHALL 引用该 change 的 9 个 capability"]
      - id: SC-STDD-005
        confidence: high
        evidence: "proposal.yaml C2; design.md D2"
        given: "提交 33437bd 的真实 Git diff"
