        when: "比较 vendored 文件清单和内容哈希"
        then: "未声明为项目 overlay 的文件 SHALL 与固定提交一致"
        and: ["项目 overlay SHALL 单独列出并接受项目测试"]
      - id: SC-STDD-003
        confidence: high
        evidence: "proposal.yaml success_criteria 1"
        given: "恢复后的离线仓库和当前 active change"
        when: "执行 python bin/stdd --help 和 python bin/stdd status"
        then: "两个命令 SHALL 退出码为 0"
        and: ["status SHALL 识别当前 change 且不得依赖网络"]
  - id: REQ-STDD-002
    description: "上一安全关键 change 的 canonical 与结构索引步骤可确定性补录"
    scenarios:
      - id: SC-STDD-004
        confidence: medium
