requirements:
  - id: REQ-BENCH-004
    description: "单独运行 benchmark suite 时报告不伪造未执行指标"
    scenarios:
      - id: SC-BENCH-004
        confidence: medium
        evidence: "existing working-tree fix; proposal.yaml C5"
        given: "只选择 latency 或 throughput suite"
        when: "生成 Markdown 报告"
        then: "未运行的 runs、measured 和 status SHALL 显示为破折号"
        and: ["未运行指标 SHALL NOT 显示 0 或 PASS", "gateway 日志 SHALL 不污染报告"]
  - id: REQ-BENCH-005
    description: "v0.1.1 发布基准可与 v0.1.0 比较但不阻塞 CI"
    scenarios:
      - id: SC-BENCH-005
        confidence: medium
        evidence: "proposal.yaml C5; existing performance-benchmark spec"
        given: "同类规则 detector mix 与 v0.1.0 报告"
        when: "运行 all suite 并记录 v0.1.1 结果"
        then: "报告 SHALL 记录日期、Python、OS、runs、P50/P95/P99 和吞吐差异"
        and: ["CI SHALL NOT 按基准数值失败"]
