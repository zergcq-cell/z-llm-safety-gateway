meta:
  capability: "open-source-governance"
  change_id: "2026-08-20-v0.1.1-release-hardening"
  created: "2026-08-20T22:38:45+08:00"
  confidence: high
requirements:
  - id: REQ-GOV-001
    description: "项目提供明确且安全的漏洞披露政策"
    scenarios:
      - id: SC-GOV-001
        confidence: high
        evidence: "proposal.yaml C6; DESIGN.md 19"
        given: "仓库根目录与 README"
        when: "安全研究者查找漏洞报告方式"
        then: "SECURITY.md SHALL 说明支持版本、私有披露渠道、响应时限和协调披露流程"
        and: ["README SHALL 链接 SECURITY.md", "政策 SHALL 要求在修复前避免公开利用细节"]
  - id: REQ-GOV-002
    description: "项目提供完整贡献者行为准则"
    scenarios:
      - id: SC-GOV-002
        confidence: high
        evidence: "proposal.yaml C6"
        given: "仓库根目录"
        when: "检查 CODE_OF_CONDUCT.md"
        then: "文件 SHALL 包含完整 Contributor Covenant 标准文本和执行方式"
        and: ["README 或 CONTRIBUTING SHALL 链接该文件"]
  - id: REQ-GOV-003
    description: "贡献、Issue、反馈和里程碑入口完整"
    scenarios:
      - id: SC-GOV-003
        confidence: medium
        evidence: "proposal.yaml C6/C7; PLAN_v0.1.1 3.3-3.5"
        given: "CONTRIBUTING、Issue/PR 模板、README 与 GitHub 仓库"
        when: "检查本地文件并读取远程 labels/milestones"
        then: "贡献流程、bug/feature 模板、反馈入口 SHALL 可用且互相一致"
        and: ["GitHub SHALL 存在 dependencies 等必要 labels", "GitHub SHALL 存在 v0.1.1 与 v0.2.0 milestones"]
