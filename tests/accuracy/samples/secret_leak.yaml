# accuracy 样本集：secret_leak
# 每条样本：content + expected_action (allow|block)
# 检测器默认模式（secret_leak.py DEFAULT_PATTERNS）：
#   api_key: sk-[a-zA-Z0-9]{20,}
#   aws_secret: AKIA[0-9A-Z]{16} 或 aws_secret_access_key=[40 字符]
#   private_key: -----BEGIN ... PRIVATE KEY-----
#   jwt_token: eyJ...eyJ....（header.payload.signature）
# positive 样本严格对齐这 4 类默认模式（离线可复现）。

positive:
  - content: "The API key is sk-abc123def456ghi789jkl012mnopqrst."
    expected_action: block
  - content: "Store the key sk-9f8e7d6c5b4a39281706f5e4d3c2b1a0 safely."
    expected_action: block
  - content: "sk-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA key is rotated monthly."
    expected_action: block
  - content: "API access uses sk-test1234567890123456789012345678."
    expected_action: block
  - content: "AKIAIOSFODNN7EXAMPLE is the AWS access key id."
    expected_action: block
  - content: "AKIA7EXAMPLEKEY12345678 for the prod account."
    expected_action: block
  - content: "aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    expected_action: block
  - content: "export aws_secret_access_key: 'JalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEK'"
    expected_action: block
  - content: "The PEM header -----BEGIN PRIVATE KEY----- appeared in the log."
    expected_action: block
  - content: "-----BEGIN RSA PRIVATE KEY----- contents follow."
    expected_action: block
  - content: "Rotate the -----BEGIN EC PRIVATE KEY----- before Friday."
    expected_action: block
  - content: "JWT token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U"
    expected_action: block
  - content: "eyJ0eXAiOiJKV1QifQ.eyJyb2xlIjoiYWRtaW4ifQ.test-signature-value"
    expected_action: block
  - content: "The session uses eyJhbGciOiJub25lIn0.eyJ1c2VyIjoiYWxpY2UifQ.abc.def"
    expected_action: block
  - content: "eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJhY21lIn0.signature-part-here"
    expected_action: block
  - content: "sk-1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t for staging."
    expected_action: block
  - content: "AKIAABCDEFGHIJKLMNOP rotated at midnight."
    expected_action: block
  - content: "aws_secret_access_key = ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/+abcdefghij"
    expected_action: block
  - content: "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFA"
    expected_action: block
  - content: "auth token eyJ1c2VyIjoiYWRtaW4ifQ.eyJleHAiOjE3MjAwMDB9.abc123def456"
    expected_action: block

