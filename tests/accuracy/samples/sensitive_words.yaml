# accuracy 样本集：sensitive_words
# 每条样本：content + expected_action (allow|block)
# 测试时注入固定 config：words=["urgent money transfer", "password reset link",
#   "account suspended"], count_block_threshold=1, count_flag_threshold=1
# 样本基于该固定词表设计（离线可复现）

