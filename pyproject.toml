[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "z-llm-safety-gateway"
version = "0.4.0"
description = "Open-source, modular LLM content safety gateway"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "z LLM Safety Gateway Contributors" },
]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30.0",
    "pyahocorasick>=2.0.0",
    "langdetect>=1.0.9",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
    "httpx[testing]>=0.27.0",
    "types-PyYAML>=6.0",
]
ml = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
grpc = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.scripts]
z-safety-gateway = "z_llm_safety_gateway.__main__:main"
zlg = "z_llm_safety_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/z_llm_safety_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["z_llm_safety_gateway"]

[tool.ruff.lint.per-file-ignores]
# Auto-generated protobuf/gRPC code — do not lint.
"src/z_llm_safety_gateway/plugins/grpc/proto/**" = ["E501", "N802", "N803", "N806", "N815", "N816", "A", "SIM", "UP", "B", "E741"]
# gRPC servicer test classes: method names must match the proto contract (PascalCase).
"tests/unit/plugins/grpc/test_client.py" = ["N802"]
"tests/integration/test_v5_plugin_app.py" = ["N802"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "langdetect.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ahocorasick.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Auto-generated protobuf/gRPC code.
module = "z_llm_safety_gateway.plugins.grpc.proto.*"
ignore_errors = true

[[tool.mypy.overrides]]
# grpcio / protobuf are optional dependencies; stubs installed via [grpc] extras.
module = "grpc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.protobuf.*"
ignore_missing_imports = true
