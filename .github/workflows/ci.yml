name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e sdk
          pip install -e .[grpc]
          pip install ruff mypy pytest pytest-asyncio pytest-cov

      - name: Lint (ruff)
        run: ruff check src/ tests/ sdk/src/ examples/plugins/python-inprocess/src examples/plugins/python-grpc/src

      - name: Type check (mypy)
        run: mypy src/

      - name: Test (pytest with coverage gate)
        env:
          PYTHONPATH: sdk/src
          OPENAI_API_KEY: sk-test
        run: |
          pytest tests/ --cov=src/z_llm_safety_gateway --cov-fail-under=80 -q
