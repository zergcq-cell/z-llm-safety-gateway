name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,grpc]"
          pip install -e sdk

      - name: Lint (ruff)
        run: ruff check src/ tests/ sdk/src/ tools/ examples/plugins/python-inprocess/src examples/plugins/python-inprocess/tests examples/plugins/python-grpc/src examples/plugins/python-grpc/tests

      - name: Type check (mypy)
        run: mypy src/ sdk/src tools/

      - name: Test (pytest with coverage gate)
        env:
          PYTHONPATH: sdk/src:examples/plugins/python-inprocess/src:examples/plugins/python-grpc/src
          OPENAI_API_KEY: sk-test
        run: |
          pytest tests/ examples/plugins/python-inprocess/tests examples/plugins/python-grpc/tests --cov=src/z_llm_safety_gateway --cov-fail-under=90 -q
