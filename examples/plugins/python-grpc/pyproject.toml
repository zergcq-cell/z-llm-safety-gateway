[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acme-grpc-detector"
version = "1.0.0"
description = "Example Python gRPC sidecar detector for the z LLM Safety Gateway"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
    "z-llm-safety-gateway-sdk>=1.0,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/acme_grpc_detector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Auto-generated protobuf/gRPC code.
"src/acme_grpc_detector/detector/v1/**" = ["E501", "N802", "N803", "N815", "N816", "A", "SIM", "UP", "B", "I001"]
# gRPC servicer method names must match the proto contract (PascalCase).
"src/acme_grpc_detector/server.py" = ["N802"]
